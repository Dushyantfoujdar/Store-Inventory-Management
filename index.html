<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Professional Inventory ERP Dashboard</title>

<!-- LIBRARIES -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

/* ========================= */
/* GLOBAL */
/* ========================= */

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;

}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

color:white;

min-height:100vh;

text-align:center;

}

.app{
padding:20px;
}

h1{

font-size:34px;
margin-bottom:10px;

}

h1,h2,h3,p{
text-align:center;
}

/* ========================= */
/* TOP BUTTONS */
/* ========================= */

.topButtons{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-top:25px;

}

.topButtons button{

padding:18px;

border:none;

border-radius:20px;

font-size:16px;

font-weight:bold;

cursor:pointer;

color:white;

transition:0.3s;

box-shadow:
0 10px 25px rgba(0,0,0,0.3);

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}

.topButtons button:hover{
transform:translateY(-4px);
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#2563eb,#1d4ed8);
}

.report{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.materialBtn{
background:linear-gradient(to right,#7c3aed,#5b21b6);
}

/* ========================= */
/* CARDS */
/* ========================= */

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.card{

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

cursor:pointer;

transition:0.3s;

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

}

.card:hover{
transform:translateY(-5px);
}

.card p{

font-size:38px;
font-weight:bold;
margin-top:15px;

}

/* ========================= */
/* SEARCH BOX */
/* ========================= */

.searchBox{

width:100%;

padding:15px;

margin-top:18px;

border:none;

border-radius:15px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;

font-size:15px;

text-align:center;

}

.searchBox::placeholder{
color:#ddd;
}

select{
background:#0f172a !important;
color:white !important;
}

option{
background:#0f172a;
color:white;
}

/* ========================= */
/* TABLE */
/* ========================= */

.tableContainer{

overflow-x:auto;

margin-top:25px;

border-radius:20px;

background:
rgba(255,255,255,0.05);

backdrop-filter:blur(10px);

padding:10px;

}

table{

width:100%;

border-collapse:collapse;

text-align:center;

}

th{

padding:18px;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

color:white;

font-size:15px;

font-weight:700;

text-align:center;

vertical-align:middle;

}

td{

padding:16px;

border-bottom:
1px solid rgba(255,255,255,0.1);

text-align:center;

vertical-align:middle;

font-size:14px;

}

tr:hover{

background:
rgba(255,255,255,0.08);

transition:0.3s;

}

/* ========================= */
/* STATUS */
/* ========================= */

.low{

color:#ff4d6d;

font-weight:bold;

text-align:center;

}

.normal{

color:#4ade80;

font-weight:bold;

text-align:center;

}

/* ========================= */
/* BUTTONS */
/* ========================= */

.editBtn,
.panelButton{

margin-top:10px;

padding:12px 18px;

border:none;

border-radius:12px;

background:
linear-gradient(
to right,
#2563eb,
#1d4ed8
);

color:white;

cursor:pointer;

font-weight:bold;

transition:0.3s;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

width:100%;

}

.editBtn:hover,
.panelButton:hover{

transform:scale(1.03);

}

/* ========================= */
/* POPUPS */
/* ========================= */

.popupOverlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(0,0,0,0.7);

display:none;

align-items:center;
justify-content:center;

z-index:9999;

padding:20px;

overflow:auto;

}

.popupBox{

width:100%;
max-width:600px;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

padding:25px;

border-radius:25px;

box-shadow:
0 10px 40px rgba(0,0,0,0.5);

text-align:center;

animation:popup 0.3s ease;

}

@keyframes popup{

from{
transform:scale(0.8);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.popupTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.closePopup{

background:red;

border:none;

color:white;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

/* ========================= */
/* QR */
/* ========================= */

#qrcode{

background:white;

padding:20px;

border-radius:20px;

margin-top:20px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

min-height:280px;

color:black;

text-align:center;

}

#reader{

margin-top:20px;

display:flex;

justify-content:center;

align-items:center;

}

/* ========================= */
/* TRANSACTION */
/* ========================= */

.transaction{

padding:15px;

margin-top:15px;

border-radius:15px;

background:
rgba(255,255,255,0.08);

text-align:center;

}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:768px){

.topButtons{
grid-template-columns:1fr;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="app">

<h1>📦 Inventory ERP Dashboard</h1>

<p>
Professional QR Based Inventory Management System
</p>

<!-- BUTTONS -->

<div class="topButtons">

<button
class="issue"
onclick="openPopup('transactionPopup')"
>
Issue / Receive
</button>

<button
class="receive"
onclick="openPopup('qrPopup')"
>
Generate QR
</button>

<button
class="scan"
onclick="openScannerPopup()"
>
Scan QR
</button>

<button
class="report"
onclick="openPopup('reportPopup')"
>
Reports
</button>

<button
class="materialBtn"
onclick="
clearMaterialForm();
openPopup('materialPopup');
"
>
Add Material
</button>

</div>

<!-- CARDS -->

<div class="cards">

<div
class="card"
onclick="scrollToInventory()"
>

<h3>Total Materials</h3>

<p id="totalMaterials"></p>

</div>

<div
class="card"
onclick="showLowStock()"
>

<h3>Low Stock</h3>

<p id="lowStock"></p>

</div>

<div
class="card"
onclick="showTodayTransactions()"
>

<h3>Today's Transactions</h3>

<p id="todayTransactions"></p>

</div>

</div>

<!-- TABLE -->

<div
id="inventorySection"
class="tableContainer"
>

<table>

<thead>

<tr>

<th>Code</th>
<th>Name</th>
<th>Category</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
<th>Edit</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

</div>

<!-- TRANSACTION POPUP -->

<div
id="transactionPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Issue / Receive</h2>

<button
class="closePopup"
onclick="closePopup('transactionPopup')"
>
X
</button>

</div>

<select
id="actionSelect"
class="searchBox"
>

<option value="issue">
Issue Material
</option>

<option value="receive">
Receive Material
</option>

</select>

<select
id="materialSelect"
class="searchBox"
></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="panelButton"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

</div>

<!-- QR POPUP -->

<div
id="qrPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Generate QR</h2>

<button
class="closePopup"
onclick="closePopup('qrPopup')"
>
X
</button>

</div>

<select
id="qrMaterial"
class="searchBox"
></select>

<button
class="panelButton"
onclick="generateQR()"
>
Generate QR
</button>

<button
class="panelButton"
onclick="downloadQR()"
>
Download QR
</button>

<div id="qrcode"></div>

</div>

</div>

<!-- SCANNER -->

<div
id="scannerPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>QR Scanner</h2>

<button
class="closePopup"
onclick="closePopup('scannerPopup')"
>
X
</button>

</div>

<div id="reader"></div>

</div>

</div>

<!-- REPORT -->

<div
id="reportPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Material Report</h2>

<button
class="closePopup"
onclick="closePopup('reportPopup')"
>
X
</button>

</div>

<div id="historyContainer"></div>

</div>

</div>

<!-- MATERIAL -->

<div
id="materialPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Add Material</h2>

<button
class="closePopup"
onclick="closePopup('materialPopup')"
>
X
</button>

</div>

<input
type="text"
id="matCode"
class="searchBox"
placeholder="Material Code"
>

<input
type="text"
id="matName"
class="searchBox"
placeholder="Material Name"
>

<input
type="text"
id="matCategory"
class="searchBox"
placeholder="Category"
>

<input
type="text"
id="matUnit"
class="searchBox"
placeholder="Unit"
>

<input
type="number"
id="matStock"
class="searchBox"
placeholder="Current Stock"
>

<input
type="number"
id="matReorder"
class="searchBox"
placeholder="Reorder Value"
>

<button
class="panelButton"
onclick="saveMaterial()"
>
Save Material
</button>

</div>

</div>

<script>

/* ========================= */
/* DATA */
/* ========================= */

let materials=[

{
code:'0838181493',
name:'TES',
category:'Valves',
unit:'Nos.',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve New',
category:'Valves',
unit:'Nos.',
stock:100,
reorder:20
},

{
code:'0838881066',
name:'Combo Valve',
category:'Valves',
unit:'Nos.',
stock:75,
reorder:20
},

{
code:'0838882104',
name:'LOT Valve',
category:'Valves',
unit:'Nos.',
stock:60,
reorder:20
},

{
code:'0838911014',
name:'Pressure Regulator',
category:'Safety',
unit:'Nos.',
stock:40,
reorder:15
}

];

let transactionHistory=[];

/* ========================= */
/* RENDER */
/* ========================= */

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

let low=0;

materials.forEach((item,index)=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.category}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">
${
item.stock<=item.reorder
?'Low'
:'Normal'
}
</td>

<td>

<button
class="editBtn"
onclick="editMaterial(${index})"
>
Edit
</button>

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
low;

document.getElementById(
'todayTransactions'
).innerHTML=
transactionHistory.length;

fillDropdowns();

}

/* ========================= */
/* DROPDOWNS */
/* ========================= */

function fillDropdowns(){

const ids=[
'materialSelect',
'qrMaterial'
];

ids.forEach(id=>{

const dropdown=
document.getElementById(id);

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

});

}

/* ========================= */
/* POPUP */
/* ========================= */

function openPopup(id){

document.getElementById(id)
.style.display='flex';

}

function closePopup(id){

document.getElementById(id)
.style.display='none';

}

/* ========================= */
/* MATERIAL */
/* ========================= */

function clearMaterialForm(){

document.getElementById(
'matCode'
).value='';

document.getElementById(
'matName'
).value='';

document.getElementById(
'matCategory'
).value='';

document.getElementById(
'matUnit'
).value='';

document.getElementById(
'matStock'
).value='';

document.getElementById(
'matReorder'
).value='';

}

function saveMaterial(){

const material={

code:
document.getElementById(
'matCode'
).value,

name:
document.getElementById(
'matName'
).value,

category:
document.getElementById(
'matCategory'
).value,

unit:
document.getElementById(
'matUnit'
).value,

stock:
parseInt(
document.getElementById(
'matStock'
).value
),

reorder:
parseInt(
document.getElementById(
'matReorder'
).value
)

};

materials.push(material);

renderTable();

closePopup(
'materialPopup'
);

Swal.fire(
'Success',
'Material Added',
'success'
);

}

/* ========================= */
/* EDIT */
/* ========================= */

function editMaterial(index){

const item=
materials[index];

Swal.fire({

title:'Edit Material',

html:`

<input
id="swalCode"
class="swal2-input"
value="${item.code}"
>

<input
id="swalName"
class="swal2-input"
value="${item.name}"
>

<input
id="swalCategory"
class="swal2-input"
value="${item.category}"
>

<input
id="swalUnit"
class="swal2-input"
value="${item.unit}"
>

<input
id="swalStock"
class="swal2-input"
value="${item.stock}"
>

<input
id="swalReorder"
class="swal2-input"
value="${item.reorder}"
>

`,

preConfirm:()=>{

item.code=
document.getElementById(
'swalCode'
).value;

item.name=
document.getElementById(
'swalName'
).value;

item.category=
document.getElementById(
'swalCategory'
).value;

item.unit=
document.getElementById(
'swalUnit'
).value;

item.stock=
parseInt(
document.getElementById(
'swalStock'
).value
);

item.reorder=
parseInt(
document.getElementById(
'swalReorder'
).value
);

renderTable();

}

});

}

/* ========================= */
/* TRANSACTION */
/* ========================= */

function submitTransaction(){

const action=
document.getElementById(
'actionSelect'
).value;

const code=
document.getElementById(
'materialSelect'
).value;

const qty=
parseInt(
document.getElementById(
'qtyInput'
).value
);

const person=
document.getElementById(
'personInput'
).value;

const material=
materials.find(
m => m.code===code
);

if(action==='issue'){

if(qty>material.stock){

Swal.fire(
'Error',
'Insufficient Stock',
'error'
);

return;

}

material.stock -= qty;

}
else{

material.stock += qty;

}

transactionHistory.push({

material:material.name,
action,
qty,
person,
date:new Date()

});

renderTable();

closePopup(
'transactionPopup'
);

Swal.fire(
'Success',
'Transaction Completed',
'success'
);

}

/* ========================= */
/* QR */
/* ========================= */

function generateQR(){

const code=
document.getElementById(
'qrMaterial'
).value;

const material=
materials.find(
m => m.code===code
);

const qrDiv=
document.getElementById(
'qrcode'
);

qrDiv.innerHTML='';

QRCode.toCanvas(

JSON.stringify({

code:material.code,
name:material.name

}),

{
width:220
},

function(error,canvas){

if(error){
console.error(error);
return;
}

qrDiv.appendChild(canvas);

qrDiv.innerHTML += `

<h3 style="margin-top:15px;">
${material.name}
</h3>

<p>
${material.code}
</p>

`;

}

);

}

function downloadQR(){

html2canvas(
document.getElementById(
'qrcode'
)

).then(canvas=>{

const link=
document.createElement('a');

link.download='QR.png';

link.href=
canvas.toDataURL();

link.click();

});

}

/* ========================= */
/* SCANNER */
/* ========================= */

function openScannerPopup(){

openPopup(
'scannerPopup'
);

document.getElementById(
'reader'
).innerHTML='';

const scanner=
new Html5Qrcode('reader');

scanner.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const data=
JSON.parse(decodedText);

closePopup(
'scannerPopup'
);

openPopup(
'transactionPopup'
);

document.getElementById(
'materialSelect'
).value=
data.code;

scanner.stop();

Swal.fire(
'QR Scanned',
data.name,
'success'
);

}

);

}

/* ========================= */
/* LOW STOCK */
/* ========================= */

function showLowStock(){

const low=
materials.filter(
m => m.stock<=m.reorder
);

let html='';

low.forEach(item=>{

html += `

<div class="transaction">

${item.name}

<br>

Stock:
${item.stock}

</div>

`;

});

Swal.fire({

title:'Low Stock Materials',

html:html ||

'No Low Stock'

});

}

/* ========================= */
/* TODAY */
/* ========================= */

function showTodayTransactions(){

let html='';

transactionHistory.forEach(item=>{

html += `

<div class="transaction">

${item.material}

<br>

${item.action}

<br>

Qty:
${item.qty}

</div>

`;

});

Swal.fire({

title:"Today's Transactions",

html:html ||

'No Transactions'

});

}

/* ========================= */
/* SCROLL */
/* ========================= */

function scrollToInventory(){

document.getElementById(
'inventorySection'
).scrollIntoView({

behavior:'smooth'

});

}

/* ========================= */
/* LOAD */
/* ========================= */

renderTable();

</script>

</body>

</html>
