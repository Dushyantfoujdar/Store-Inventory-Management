<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Inventory ERP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

color:white;
min-height:100vh;

}

.app{
padding:20px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.topButtons{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-top:25px;

}

.topButtons button{

padding:18px;

border:none;

border-radius:20px;

font-size:16px;

font-weight:bold;

cursor:pointer;

color:white;

transition:0.3s;

}

.topButtons button:hover{
transform:translateY(-4px);
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#2563eb,#1d4ed8);
}

.report{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:25px;

}

.card{

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(10px);

cursor:pointer;

transition:0.3s;

}

.card:hover{
transform:translateY(-5px);
}

.card p{

font-size:36px;
font-weight:bold;
margin-top:10px;

}

.section{

display:none;

margin-top:25px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(10px);

}

.searchBox{

width:100%;

padding:15px;

border:none;

border-radius:15px;

margin-top:15px;

background:
rgba(255,255,255,0.1);

color:white;

font-size:15px;

}

.searchBox::placeholder{
color:#ddd;
}

select{
background:#0f172a !important;
color:white !important;
}

option{
background:#0f172a;
color:white;
}

.panelButton{

width:100%;

padding:15px;

border:none;

border-radius:15px;

margin-top:18px;

cursor:pointer;

font-size:16px;

font-weight:bold;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

color:white;

}

.tableContainer{

overflow-x:auto;

margin-top:20px;

}

table{

width:100%;
border-collapse:collapse;

}

th{

padding:15px;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

}

td{

padding:14px;

border-bottom:
1px solid rgba(255,255,255,0.1);

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.editBtn{

padding:8px 14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

cursor:pointer;

}

.editBtn:hover{
background:#1d4ed8;
}

.transaction{

padding:15px;

border-radius:15px;

background:
rgba(255,255,255,0.08);

margin-top:15px;

}

#qrcode{

background:white;

padding:20px;

border-radius:20px;

margin-top:20px;

display:flex;

flex-direction:column;

align-items:center;

color:black;

}

</style>

</head>

<body>

<div class="app">

<h1>📦 Inventory ERP Dashboard</h1>

<p>QR Based Inventory Management System</p>

<!-- TOP BUTTONS -->

<div class="topButtons">

<button
class="issue"
onclick="toggleSection('transactionSection')"
>
Issue / Receive
</button>

<button
class="receive"
onclick="toggleSection('qrSection')"
>
Generate QR
</button>

<button
class="scan"
onclick="toggleScanner()"
>
Scan QR
</button>

<button
class="report"
onclick="toggleSection('reportSection')"
>
Reports
</button>

<button
class="scan"
onclick="toggleSection('materialSection')"
>
Add Material
</button>

</div>

<!-- ISSUE RECEIVE -->

<div
id="transactionSection"
class="section"
>

<h2>Issue / Receive Material</h2>

<select
id="actionSelect"
class="searchBox"
>

<option value="issue">
Issue Material
</option>

<option value="receive">
Receive Material
</option>

</select>

<select
id="materialSelect"
class="searchBox"
></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="panelButton"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<!-- QR SECTION -->

<div
id="qrSection"
class="section"
>

<h2>Generate QR</h2>

<select
id="qrMaterial"
class="searchBox"
></select>

<button
class="panelButton"
onclick="generateQRLabel()"
>
Generate QR
</button>

<button
class="panelButton"
onclick="downloadQR()"
>
Download QR
</button>

<div id="qrcode"></div>

</div>

<!-- SCANNER -->

<div
id="scannerSection"
class="section"
>

<h2>QR Scanner</h2>

<div id="reader"></div>

</div>

<!-- REPORTS -->

<div
id="reportSection"
class="section"
>

<h2>Material Transaction Report</h2>

<select
id="reportMaterial"
class="searchBox"
></select>

<input
type="date"
id="fromDate"
class="searchBox"
>

<input
type="date"
id="toDate"
class="searchBox"
>

<button
class="panelButton"
onclick="generateReport()"
>
Generate Report
</button>

<button
class="panelButton"
onclick="downloadExcel()"
>
Download Excel
</button>

<button
class="panelButton"
onclick="downloadPDF()"
>
Download PDF
</button>

<div id="historyContainer"></div>

</div>

<!-- MATERIAL SECTION -->

<div
id="materialSection"
class="section"
>

<h2>Add / Edit Material</h2>

<input
type="text"
id="matCode"
class="searchBox"
placeholder="Material Code"
>

<input
type="text"
id="matName"
class="searchBox"
placeholder="Material Name"
>

<input
type="text"
id="matCategory"
class="searchBox"
placeholder="Category"
>

<input
type="text"
id="matUnit"
class="searchBox"
placeholder="Unit"
>

<input
type="number"
id="matStock"
class="searchBox"
placeholder="Current Stock"
>

<input
type="number"
id="matReorder"
class="searchBox"
placeholder="Reorder Value"
>

<button
class="panelButton"
onclick="saveMaterial()"
>
Save Material
</button>

</div>

<!-- CARDS -->

<div class="cards">

<div
class="card"
onclick="scrollToInventory()"
>

<h3>Total Materials</h3>

<p id="totalMaterials"></p>

</div>

<div
class="card"
onclick="showLowStock()"
>

<h3>Low Stock</h3>

<p id="lowStock"></p>

</div>

<div
class="card"
onclick="showTodayTransactions()"
>

<h3>Today's Transactions</h3>

<p id="todayTransactions"></p>

</div>

</div>

<!-- INVENTORY TABLE -->

<div
id="inventorySection"
class="section"
style="display:block;"
>

<h2>Inventory Table</h2>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>

<tr>

<th>Code</th>
<th>Name</th>
<th>Category</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
<th>Edit</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

</div>

</div>

<script>

let materials=[

{
code:'0838181493',
name:'TES',
category:'Valves',
unit:'Nos.',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve New',
category:'Valves',
unit:'Nos.',
stock:100,
reorder:20
},

{
code:'0838881066',
name:'Combo Valve',
category:'Valves',
unit:'Nos.',
stock:75,
reorder:20
},

{
code:'0838882104',
name:'LOT Valve',
category:'Valves',
unit:'Nos.',
stock:60,
reorder:20
},

{
code:'0838911014',
name:'Pressure Regulator',
category:'Safety',
unit:'Nos.',
stock:40,
reorder:15
}

];

let transactionHistory=
JSON.parse(
localStorage.getItem('transactions')
)||[];

const savedMaterials=
JSON.parse(
localStorage.getItem('materials')
);

if(savedMaterials){
materials=savedMaterials;
}

function saveData(){

localStorage.setItem(
'transactions',
JSON.stringify(transactionHistory)
);

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

}

function toggleSection(id){

hideSections();

document.getElementById(id)
.style.display='block';

}

function hideSections(){

document.querySelectorAll(
'.section'
).forEach(sec=>{

if(sec.id!=='inventorySection'){
sec.style.display='none';
}

});

}

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

let low=0;

materials.forEach((item,index)=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>
<td>${item.name}</td>
<td>${item.category}</td>
<td>${item.unit}</td>
<td>${item.stock}</td>
<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">

${
item.stock<=item.reorder
?'Low'
:'Normal'
}

</td>

<td>

<button
class="editBtn"
data-index="${index}"
>
Edit
</button>

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
low;

const today=
new Date().toDateString();

const todayCount=
transactionHistory.filter(t=>{

return new Date(t.date)
.toDateString()===today;

}).length;

document.getElementById(
'todayTransactions'
).innerHTML=
todayCount;

fillDropdowns();

saveData();

document
.querySelectorAll('.editBtn')
.forEach(btn=>{

btn.addEventListener(
'click',
function(){

editMaterial(
this.dataset.index
);

}

);

});

}

function fillDropdowns(){

const ids=[
'materialSelect',
'qrMaterial',
'reportMaterial'
];

ids.forEach(id=>{

const dropdown=
document.getElementById(id);

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

});

}

function submitTransaction(){

const action=
document.getElementById(
'actionSelect'
).value;

const code=
document.getElementById(
'materialSelect'
).value;

const qty=
parseInt(
document.getElementById(
'qtyInput'
).value
);

const person=
document.getElementById(
'personInput'
).value;

const material=
materials.find(
m => m.code===code
);

if(!qty || !person){

Swal.fire(
'Error',
'Fill all details',
'error'
);

return;

}

if(action==='issue'){

if(qty>material.stock){

Swal.fire(
'Error',
'Insufficient Stock',
'error'
);

return;

}

material.stock -= qty;

}
else{

material.stock += qty;

}

transactionHistory.unshift({

material:material.name,
materialCode:material.code,
action:action,
qty:qty,
person:person,
balance:material.stock,
date:new Date().toISOString()

});

saveData();

renderTable();

Swal.fire(
'Success',
'Transaction Successful',
'success'
);

}

function saveMaterial(){

const code=
document.getElementById(
'matCode'
).value;

const name=
document.getElementById(
'matName'
).value;

const category=
document.getElementById(
'matCategory'
).value;

const unit=
document.getElementById(
'matUnit'
).value;

const stock=
parseInt(
document.getElementById(
'matStock'
).value
);

const reorder=
parseInt(
document.getElementById(
'matReorder'
).value
);

if(
!code ||
!name ||
!category ||
!unit ||
isNaN(stock) ||
isNaN(reorder)
){

Swal.fire(
'Error',
'Fill all fields',
'error'
);

return;

}

const existing=
materials.find(
m => m.code===code
);

if(existing){

existing.name=name;
existing.category=category;
existing.unit=unit;
existing.stock=stock;
existing.reorder=reorder;

Swal.fire(
'Updated',
'Material Updated',
'success'
);

}
else{

materials.push({

code,
name,
category,
unit,
stock,
reorder

});

Swal.fire(
'Success',
'Material Added',
'success'
);

}

clearMaterialForm();

renderTable();

}

function editMaterial(index){

const item=
materials[index];

toggleSection(
'materialSection'
);

document.getElementById(
'matCode'
).value=item.code;

document.getElementById(
'matName'
).value=item.name;

document.getElementById(
'matCategory'
).value=item.category;

document.getElementById(
'matUnit'
).value=item.unit;

document.getElementById(
'matStock'
).value=item.stock;

document.getElementById(
'matReorder'
).value=item.reorder;

}

function clearMaterialForm(){

document.getElementById(
'matCode'
).value='';

document.getElementById(
'matName'
).value='';

document.getElementById(
'matCategory'
).value='';

document.getElementById(
'matUnit'
).value='';

document.getElementById(
'matStock'
).value='';

document.getElementById(
'matReorder'
).value='';

}

function generateQRLabel(){

const code=
document.getElementById(
'qrMaterial'
).value;

const material=
materials.find(
m => m.code===code
);

const qrDiv=
document.getElementById(
'qrcode'
);

qrDiv.innerHTML='';

const canvas=
document.createElement(
'canvas'
);

qrDiv.appendChild(canvas);

QRCode.toCanvas(

canvas,

JSON.stringify({

code:material.code,
name:material.name

}),

{
width:220
},

function(error){

if(error){

Swal.fire(
'Error',
'QR Generation Failed',
'error'
);

return;

}

const label=
document.createElement('div');

label.innerHTML=`

<h3>${material.name}</h3>
<p>${material.code}</p>

`;

qrDiv.appendChild(label);

}

);

}

function downloadQR(){

html2canvas(
document.getElementById(
'qrcode'
)

).then(canvas=>{

const link=
document.createElement('a');

link.download='QR.png';

link.href=
canvas.toDataURL();

link.click();

});

}

function toggleScanner(){

toggleSection(
'scannerSection'
);

document.getElementById(
'reader'
).innerHTML='';

const html5QrCode=
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

try{

const qrData=
JSON.parse(decodedText);

const material=
materials.find(
m => m.code===qrData.code
);

if(material){

html5QrCode.stop();

toggleSection(
'transactionSection'
);

document.getElementById(
'materialSelect'
).value=
material.code;

Swal.fire(
'QR Scanned',
material.name,
'success'
);

}

}
catch(err){

Swal.fire(
'Error',
'Invalid QR',
'error'
);

}

}

);

}

function generateReport(){

const materialCode=
document.getElementById(
'reportMaterial'
).value;

const from=
document.getElementById(
'fromDate'
).value;

const to=
document.getElementById(
'toDate'
).value;

const container=
document.getElementById(
'historyContainer'
);

container.innerHTML='';

const filtered=
transactionHistory.filter(t=>{

const tDate=
new Date(t.date);

const fromDate=
new Date(from);

const toDate=
new Date(to);

toDate.setHours(23,59,59,999);

return (

t.materialCode===materialCode &&

tDate>=fromDate &&

tDate<=toDate

);

});

if(filtered.length===0){

container.innerHTML=`
<div class="transaction">
No Transactions Found
</div>
`;

return;

}

filtered.forEach(item=>{

container.innerHTML += `

<div class="transaction">

<b>${item.material}</b>

<br><br>

Action:
${item.action}

<br>

Quantity:
${item.qty}

<br>

Issued To / Received From:
${item.person}

<br>

Balance:
${item.balance}

<br>

Date:
${new Date(item.date)
.toLocaleString()}

</div>

`;

});

window.filteredTransactions=
filtered;

}

function downloadExcel(){

const data=
window.filteredTransactions || [];

const ws=
XLSX.utils.json_to_sheet(data);

const wb=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
'Transactions'
);

XLSX.writeFile(
wb,
'Material_Report.xlsx'
);

}

function downloadPDF(){

const { jsPDF }=
window.jspdf;

const pdf=
new jsPDF();

pdf.text(
'Material Transaction Report',
20,
20
);

let y=40;

(
window.filteredTransactions || []
).forEach(item=>{

pdf.text(

`${item.material}
 | ${item.action}
 | Qty:${item.qty}`,

10,
y

);

y += 10;

});

pdf.save(
'Material_Report.pdf'
);

}

function showTodayTransactions(){

toggleSection(
'reportSection'
);

}

function scrollToInventory(){

document.getElementById(
'inventorySection'
).scrollIntoView({

behavior:'smooth'

});

}

function showLowStock(){

const low=
materials.filter(
m => m.stock<=m.reorder
);

let text='';

low.forEach(item=>{

text += `
${item.name}
 - Stock:
${item.stock}<br>
`;

});

Swal.fire({

title:'Low Stock Materials',
html:text ||
'No Low Stock',
icon:'warning'

});

}

function searchMaterial(value){

value=
value.toLowerCase();

const rows=
document.querySelectorAll(
'#inventoryTable tr'
);

rows.forEach(row=>{

if(
row.innerText
.toLowerCase()
.includes(value)
){

row.style.display='';

}
else{

row.style.display='none';

}

});

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
