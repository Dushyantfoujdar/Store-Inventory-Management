<!-- REPLACE YOUR INVENTORY TABLE tbody CODE WITH THIS -->

<tbody id="inventoryTable"></tbody>

<!-- REPLACE YOUR renderTable() FUNCTION WITH THIS -->

<script>

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

let low=0;

materials.forEach((item,index)=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.category}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">

${
item.stock<=item.reorder
?'Low'
:'Normal'
}

</td>

<td>

<button
onclick="editMaterial(${index})"
style="
padding:8px 12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
"
>
Edit
</button>

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
low;

const today=
new Date().toDateString();

const todayCount=
transactionHistory.filter(t=>{

return new Date(t.date)
.toDateString()===today;

}).length;

document.getElementById(
'todayTransactions'
).innerHTML=
todayCount;

fillDropdowns();

saveData();

}

</script>

<!-- ADD THESE FUNCTIONS INSIDE YOUR SCRIPT -->

<script>

function saveMaterial(){

const code=
document.getElementById(
'matCode'
).value;

const name=
document.getElementById(
'matName'
).value;

const category=
document.getElementById(
'matCategory'
).value;

const unit=
document.getElementById(
'matUnit'
).value;

const stock=
parseInt(
document.getElementById(
'matStock'
).value
);

const reorder=
parseInt(
document.getElementById(
'matReorder'
).value
);

if(
!code ||
!name ||
!category ||
!unit ||
!stock ||
!reorder
){

Swal.fire(
'Error',
'Fill all fields',
'error'
);

return;

}

const existing=
materials.find(
m => m.code===code
);

if(existing){

existing.name=name;

existing.category=category;

existing.unit=unit;

existing.stock=stock;

existing.reorder=reorder;

Swal.fire(
'Updated',
'Material Updated',
'success'
);

}
else{

materials.push({

code,
name,
category,
unit,
stock,
reorder

});

Swal.fire(
'Success',
'Material Added',
'success'
);

}

renderTable();

clearMaterialForm();

}

function editMaterial(index){

const item=
materials[index];

toggleSection(
'addMaterialSection'
);

document.getElementById(
'matCode'
).value=
item.code;

document.getElementById(
'matName'
).value=
item.name;

document.getElementById(
'matCategory'
).value=
item.category;

document.getElementById(
'matUnit'
).value=
item.unit;

document.getElementById(
'matStock'
).value=
item.stock;

document.getElementById(
'matReorder'
).value=
item.reorder;

}

function clearMaterialForm(){

document.getElementById(
'matCode'
).value='';

document.getElementById(
'matName'
).value='';

document.getElementById(
'matCategory'
).value='';

document.getElementById(
'matUnit'
).value='';

document.getElementById(
'matStock'
).value='';

document.getElementById(
'matReorder'
).value='';

}

function scrollToInventory(){

document.querySelector(
'.tableContainer'
).scrollIntoView({

behavior:'smooth'

});

}

function showTodayTransactions(){

toggleSection(
'reportSection'
);

const container=
document.getElementById(
'historyContainer'
);

container.innerHTML='';

const today=
new Date().toDateString();

const filtered=
transactionHistory.filter(t=>{

return new Date(t.date)
.toDateString()===today;

});

filtered.forEach(item=>{

container.innerHTML += `

<div class="transaction">

<b>${item.material}</b>

<br><br>

Action:
${item.action}

<br>

Quantity:
${item.qty}

<br>

Issued To / Received From:
${item.person}

<br>

Balance:
${item.balance}

<br>

Date:
${item.date}

</div>

`;

});

}

</script>
