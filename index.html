<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Inventory Dashboard</title>

<!-- LIBRARIES -->

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1e3a8a,
#0f766e
);

background-size:400% 400%;

animation:bgmove 15s ease infinite;

color:white;

min-height:100vh;

}

@keyframes bgmove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.app{
padding:25px;
}

h1{
font-size:38px;
margin-bottom:10px;
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:25px;

}

.card{

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

cursor:pointer;

transition:0.3s;

}

.card:hover{

transform:translateY(-5px);

}

.card p{
font-size:40px;
font-weight:bold;
margin-top:15px;
}

.searchBox{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:18px;

font-size:16px;

background:
rgba(255,255,255,0.1);

color:white;

outline:none;

}

.searchBox::placeholder{
color:#ddd;
}

select{

color:white !important;

background:
rgba(15,23,42,0.95) !important;

}

option{

background:#0f172a;

color:white;

}

.tableContainer{

margin-top:30px;

overflow-x:auto;

padding:10px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

}

table{
width:100%;
border-collapse:collapse;
color:white;
}

th{

padding:18px;

text-align:left;

background:
linear-gradient(
to right,
#06b6d4,
#2563eb,
#7c3aed
);

}

td{

padding:16px;

border-bottom:
1px solid rgba(255,255,255,0.1);

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.buttons{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-top:30px;

}

button{

flex:1;

padding:16px;

border:none;

border-radius:18px;

font-size:15px;

font-weight:bold;

cursor:pointer;

color:white;

transition:0.3s;

}

button:hover{

transform:translateY(-3px);

opacity:0.95;

}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

.download{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.panel{

margin-top:25px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

display:none;

animation:fadeIn 0.3s ease;

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0px);
}

}

#qrcode{

margin-top:25px;

padding:25px;

border-radius:20px;

background:white;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

min-height:350px;

color:black;

}

.qrLabel{
margin-top:20px;
text-align:center;
}

.transactionBox{

margin-top:35px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

}

.transaction{

padding:18px;

border-radius:18px;

margin-top:15px;

background:
rgba(255,255,255,0.08);

}

.filterBox{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-top:20px;

}

#reader{
margin-top:25px;
}

@media(max-width:768px){

.buttons,
.filterBox{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="app">

<h1>Smart Inventory Dashboard</h1>

<p>QR Based Inventory Management System</p>

<!-- CARDS -->

<div class="cards">

<div class="card">

<h3>Total Materials</h3>

<p id="totalMaterials"></p>

</div>

<div
class="card"
onclick="showLowStock()"
>

<h3>Low Stock Materials</h3>

<p id="lowStock"></p>

</div>

</div>

<!-- LOW STOCK PANEL -->

<div
id="lowStockPanel"
class="panel"
>

<h2>Low Stock Materials</h2>

<div id="lowStockList"></div>

</div>

<!-- SEARCH -->

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<!-- TABLE -->

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Material Code</th>
<th>Material Name</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<!-- BUTTONS -->

<div class="buttons">

<button class="issue" onclick="openPanel()">
Issue / Receive
</button>

<button class="scan" onclick="startScanner()">
Scan QR
</button>

<button class="receive" onclick="openQRPanel()">
Generate QR
</button>

</div>

<!-- TRANSACTION PANEL -->

<div id="transactionPanel" class="panel">

<h2 id="panelTitle">
Material Transaction
</h2>

<select id="actionSelect" class="searchBox">

<option value="issue">
Issue Material
</option>

<option value="receive">
Receive Material
</option>

</select>

<select id="materialSelect" class="searchBox"></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="scan"
style="margin-top:20px;"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<!-- QR PANEL -->

<div id="qrPanel" class="panel">

<h2>QR Label Generator</h2>

<select id="qrMaterial" class="searchBox"></select>

<button
class="scan"
style="margin-top:20px;"
onclick="generateQRLabel()"
>
Generate QR Label
</button>

<button
class="download"
style="margin-top:20px;"
onclick="downloadQR()"
>
Download QR PNG
</button>

<div id="qrcode"></div>

</div>

<!-- QR SCANNER -->

<div id="reader"></div>

<!-- TRANSACTION HISTORY -->

<div class="transactionBox">

<h2>Material Transaction History</h2>

<div class="filterBox">

<select id="reportMaterial" class="searchBox"></select>

<input
type="date"
id="fromDate"
class="searchBox"
>

<input
type="date"
id="toDate"
class="searchBox"
>

<button
class="scan"
onclick="generateHistory()"
>
Generate History
</button>

<button
class="download"
onclick="downloadExcel()"
>
Download Excel
</button>

<button
class="download"
onclick="downloadPDF()"
>
Download PDF
</button>

</div>

<div id="historyContainer"></div>

</div>

</div>

<script>

const materials=[

{code:'0838181493',name:'TES',unit:'Nos.',stock:95,reorder:20},

{code:'0838880104',name:'SC Valve New',unit:'Nos.',stock:100,reorder:20},

{code:'0838881066',name:'Combo Valve',unit:'Nos.',stock:75,reorder:20},

{code:'0838882104',name:'LOT Valve',unit:'Nos.',stock:60,reorder:20},

{code:'0838911014',name:'Pressure Regulator',unit:'Nos.',stock:40,reorder:15},

{code:'0838920104',name:'Safety Caps',unit:'Nos.',stock:250,reorder:50},

{code:'0838929014',name:'Nylon Thread',unit:'Nos.',stock:150,reorder:30},

{code:'0838929034',name:'SS Clip',unit:'Nos.',stock:80,reorder:20},

{code:'0838930764',name:'NBR O-Ring',unit:'Nos.',stock:120,reorder:25},

{code:'0838930774',name:'FKM O-Ring',unit:'Nos.',stock:90,reorder:25},

{code:'6183050164',name:'Teflon Tape',unit:'Nos.',stock:200,reorder:40},

{code:'8601061404',name:'Zinc Chrome Primer',unit:'Litres',stock:50,reorder:10},

{code:'8614022944',name:'Paint Enamel Signal Red',unit:'Litres',stock:70,reorder:15},

{code:'8614023204',name:'Paint Enamel White',unit:'Litres',stock:65,reorder:15},

{code:'8614023664',name:'Paint Synthetic Enamel Oxford Blue',unit:'Litres',stock:55,reorder:15},

{code:'8630200504',name:'Thinner F/Enamel Paint',unit:'Litres',stock:85,reorder:20},

{code:'8740155404',name:'Brown Soap F/LPG Conveyor',unit:'Kg',stock:45,reorder:10},

{code:'9532500114',name:'Gloves Hand Cotton 10IN',unit:'Nos.',stock:300,reorder:60},

{code:'0838920203',name:'LOT CAP',unit:'Nos.',stock:110,reorder:25}

];

let transactionHistory=[];

let filteredHistory=[];

function hidePanels(){

document.getElementById(
'transactionPanel'
).style.display='none';

document.getElementById(
'qrPanel'
).style.display='none';

document.getElementById(
'lowStockPanel'
).style.display='none';

}

function renderTable(){

const table=
document.getElementById('inventoryTable');

table.innerHTML='';

let low=0;

materials.forEach(item=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder?'low':'normal'
}">

${
item.stock<=item.reorder?'Low':'Normal'
}

</td>

</tr>

`;

});

document.getElementById('totalMaterials').innerHTML=
materials.length;

document.getElementById('lowStock').innerHTML=
low;

fillDropdowns();

}

function fillDropdowns(){

const materialSelect=
document.getElementById('materialSelect');

const qrMaterial=
document.getElementById('qrMaterial');

const reportMaterial=
document.getElementById('reportMaterial');

materialSelect.innerHTML='';
qrMaterial.innerHTML='';
reportMaterial.innerHTML='';

materials.forEach(item=>{

materialSelect.innerHTML += `
<option value="${item.code}">
${item.code} - ${item.name}
</option>
`;

qrMaterial.innerHTML += `
<option value="${item.code}">
${item.code} - ${item.name}
</option>
`;

reportMaterial.innerHTML += `
<option value="${item.name}">
${item.name}
</option>
`;

});

}

function showLowStock(){

hidePanels();

const panel =
document.getElementById(
'lowStockPanel'
);

const list =
document.getElementById(
'lowStockList'
);

panel.style.display='block';

list.innerHTML='';

const lowMaterials =
materials.filter(
m => m.stock <= m.reorder
);

if(lowMaterials.length===0){

list.innerHTML=
'<p>No Low Stock Materials</p>';

return;

}

lowMaterials.forEach(item=>{

list.innerHTML += `

<div class="transaction">

<b>${item.name}</b>

<br><br>

Code:
${item.code}

<br>

Current Stock:
${item.stock}

<br>

Reorder Level:
${item.reorder}

</div>

`;

});

panel.scrollIntoView({
behavior:'smooth'
});

}

function openPanel(){

hidePanels();

document.getElementById(
'transactionPanel'
).style.display='block';

document.getElementById(
'transactionPanel'
).scrollIntoView({
behavior:'smooth'
});

}

function openQRPanel(){

hidePanels();

document.getElementById(
'qrPanel'
).style.display='block';

document.getElementById(
'qrPanel'
).scrollIntoView({
behavior:'smooth'
});

}

function submitTransaction(){

const action =
document.getElementById(
'actionSelect'
).value;

const code =
document.getElementById(
'materialSelect'
).value;

const qty =
parseInt(
document.getElementById(
'qtyInput'
).value
);

const person =
document.getElementById(
'personInput'
).value;

const material =
materials.find(m => m.code === code);

if(!qty || !person){

alert('Fill All Details');

return;

}

if(action==='issue'){

if(qty > material.stock){

alert('Insufficient Stock');

return;

}

material.stock -= qty;

}

if(action==='receive'){

material.stock += qty;

}

transactionHistory.unshift({

material:material.name,

code:material.code,

action:action,

qty:qty,

person:person,

balance:material.stock,

date:new Date().toLocaleString()

});

renderTable();

alert('Transaction Successful');

document.getElementById(
'qtyInput'
).value='';

document.getElementById(
'personInput'
).value='';

}

function startScanner(){

hidePanels();

document.getElementById(
'reader'
).scrollIntoView({
behavior:'smooth'
});

const html5QrCode =
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

try{

const qrData =
JSON.parse(decodedText);

const material =
materials.find(
m => m.code === qrData.code
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

html5QrCode.stop();

hidePanels();

document.getElementById(
'transactionPanel'
).style.display='block';

document.getElementById(
'materialSelect'
).value = material.code;

document.getElementById(
'panelTitle'
).innerHTML =
'Scanned Material : ' + material.name;

document.getElementById(
'transactionPanel'
).scrollIntoView({
behavior:'smooth'
});

document.getElementById(
'reader'
).innerHTML='';

}
catch(err){

alert('Invalid QR Code');

html5QrCode.stop();

}

}

);

}

function generateQRLabel(){

const code =
document.getElementById('qrMaterial').value;

const material =
materials.find(m => m.code === code);

const qrDiv =
document.getElementById('qrcode');

qrDiv.innerHTML = '';

const canvas =
document.createElement('canvas');

qrDiv.appendChild(canvas);

const qrData = JSON.stringify({

code: material.code,

name: material.name

});

QRCode.toCanvas(

canvas,

qrData,

{
width:220,
margin:2,
color:{
dark:'#000000',
light:'#FFFFFF'
}
},

function(error){

if(error){

alert('QR Generation Failed');

return;

}

const label =
document.createElement('div');

label.className='qrLabel';

label.innerHTML = `

<h3>${material.name}</h3>

<p><b>Code:</b> ${material.code}</p>

`;

qrDiv.appendChild(label);

}

);

}

function downloadQR(){

const qrElement=
document.getElementById('qrcode');

html2canvas(qrElement).then(canvas=>{

const link=
document.createElement('a');

link.download=
'QR_Label.png';

link.href=
canvas.toDataURL('image/png');

link.click();

});

}

function generateHistory(){

const material=
document.getElementById('reportMaterial').value;

const from=
new Date(
document.getElementById('fromDate').value
);

const to=
new Date(
document.getElementById('toDate').value
);

to.setHours(23,59,59,999);

filteredHistory=
transactionHistory.filter(item=>{

const d=new Date(item.date);

return item.material===material &&
d>=from &&
d<=to;

});

const container=
document.getElementById('historyContainer');

container.innerHTML='';

filteredHistory.forEach(item=>{

container.innerHTML += `

<div class="transaction">

<b>${item.material}</b>

<br><br>

Action:
${item.action}

<br>

Quantity:
${item.qty}

<br>

${item.action==='issue'
?'Issued To'
:'Received From'}:
${item.person}

<br>

Balance:
${item.balance}

<br>

Date:
${item.date}

</div>

`;

});

}

function downloadExcel(){

const ws=
XLSX.utils.json_to_sheet(filteredHistory);

const wb=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
'Transactions'
);

XLSX.writeFile(
wb,
'Material_Transactions.xlsx'
);

}

function downloadPDF(){

const { jsPDF }=
window.jspdf;

const pdf=
new jsPDF();

let y=20;

pdf.text(
'Material Transaction History',
20,
20
);

filteredHistory.forEach(item=>{

pdf.text(

`${item.material}
 | ${item.action}
 | Qty:${item.qty}
 | ${item.person}
 | Bal:${item.balance}`,

10,
y+=10

);

});

pdf.save('Material_Transactions.pdf');

}

function searchMaterial(value){

value=value.toLowerCase();

const rows=
document.querySelectorAll(
'#inventoryTable tr'
);

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
