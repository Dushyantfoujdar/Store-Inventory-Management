<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Inventory ERP Dashboard</title>

<!-- LIBRARIES -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

color:white;
min-height:100vh;
text-align:center;

}

.app{
padding:20px;
max-width:1400px;
margin:auto;
}

h1{
font-size:34px;
margin-bottom:10px;
text-align:center;
}

p{
text-align:center;
}

.topButtons{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;
margin-top:25px;

}

.topButtons button{

padding:18px;
border:none;
border-radius:20px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
transition:0.3s;

box-shadow:
0 10px 25px rgba(0,0,0,0.3);

}

.topButtons button:hover{
transform:translateY(-4px);
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#2563eb,#1d4ed8);
}

.report{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.materialBtn{
background:linear-gradient(to right,#7c3aed,#5b21b6);
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;
margin-top:30px;

}

.card{

padding:25px;
border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

cursor:pointer;
transition:0.3s;

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

text-align:center;

}

.card:hover{
transform:translateY(-5px);
}

.card p{

font-size:38px;
font-weight:bold;
margin-top:15px;

}

.searchBox{

width:100%;

padding:15px;

margin-top:18px;

border:none;

border-radius:15px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;

font-size:15px;

text-align:center;

}

.searchBox::placeholder{
color:#ddd;
text-align:center;
}

select{
background:#0f172a !important;
color:white !important;
text-align:center;
}

option{
background:#0f172a;
color:white;
text-align:center;
}

.tableContainer{

overflow-x:auto;

margin-top:25px;

border-radius:20px;

}

table{

width:100%;
border-collapse:collapse;
text-align:center;

}

th{

padding:16px;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

text-align:center;

}

td{

padding:15px;

border-bottom:
1px solid rgba(255,255,255,0.1);

text-align:center;

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.panelButton{

margin-top:20px;

padding:15px;

width:100%;

border:none;

border-radius:15px;

font-size:16px;

font-weight:bold;

cursor:pointer;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

color:white;

text-align:center;

}

.transaction{

padding:15px;

margin-top:15px;

border-radius:15px;

background:
rgba(255,255,255,0.08);

text-align:center;

}

.editBtn{

padding:8px 14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

cursor:pointer;

}

.editBtn:hover{
background:#1d4ed8;
}

.popupOverlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(0,0,0,0.7);

display:none;

align-items:center;
justify-content:center;

z-index:9999;

padding:20px;

overflow:auto;

}

.popupBox{

width:100%;
max-width:600px;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

padding:25px;

border-radius:25px;

box-shadow:
0 10px 40px rgba(0,0,0,0.5);

animation:popup 0.3s ease;

text-align:center;

}

@keyframes popup{

from{
transform:scale(0.8);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

.popupTop{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

}

.popupTop h2{
flex:1;
text-align:center;
}

.closePopup{

background:red;

border:none;

color:white;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

#qrcode{

background:white;

padding:20px;

border-radius:20px;

margin-top:20px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

min-height:280px;

color:black;

text-align:center;

}

#reader{
margin-top:20px;
display:flex;
justify-content:center;
}

#inventorySection{
text-align:center;
}

@media(max-width:768px){

.topButtons{
grid-template-columns:1fr;
}

.cards{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="app">

<h1>📦 Inventory ERP Dashboard</h1>

<p>Professional QR Based Inventory Management System</p>

<!-- TOP BUTTONS -->

<div class="topButtons">

<button
class="issue"
onclick="openTransactionPopup()"
>
Issue / Receive
</button>

<button
class="receive"
onclick="openQRPopup()"
>
Generate QR
</button>

<button
class="scan"
onclick="openScannerPopup()"
>
Scan QR
</button>

<button
class="report"
onclick="openReportPopup()"
>
Reports
</button>

<button
class="materialBtn"
onclick="
clearMaterialForm();
openMaterialPopup();
"
>
Add Material
</button>

</div>

<!-- CARDS -->

<div class="cards">

<div
class="card"
onclick="scrollToInventory()"
>

<h3>Total Materials</h3>

<p id="totalMaterials"></p>

</div>

<div
class="card"
onclick="showLowStock()"
>

<h3>Low Stock</h3>

<p id="lowStock"></p>

</div>

<div
class="card"
onclick="showTodayTransactionsPopup()"
>

<h3>Today's Transactions</h3>

<p id="todayTransactions"></p>

</div>

</div>

<!-- INVENTORY -->

<div id="inventorySection">

<div class="tableContainer">

<table>

<thead>

<tr>

<th>Code</th>
<th>Name</th>
<th>Category</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
<th>Edit</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

</div>

</div>

<script>

let materials=[

{
code:'0838181493',
name:'TES',
category:'Valves',
unit:'Nos.',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve New',
category:'Valves',
unit:'Nos.',
stock:100,
reorder:20
},

{
code:'0838881066',
name:'Combo Valve',
category:'Valves',
unit:'Nos.',
stock:75,
reorder:20
},

{
code:'0838882104',
name:'LOT Valve',
category:'Valves',
unit:'Nos.',
stock:60,
reorder:20
},

{
code:'0838911014',
name:'Pressure Regulator',
category:'Safety',
unit:'Nos.',
stock:40,
reorder:15
},

{
code:'0838920104',
name:'Safety Caps',
category:'Safety',
unit:'Nos.',
stock:250,
reorder:50
},

{
code:'0838929014',
name:'Nylon Thread',
category:'Consumables',
unit:'Nos.',
stock:150,
reorder:30
},

{
code:'0838929034',
name:'SS Clip',
category:'Consumables',
unit:'Nos.',
stock:80,
reorder:20
},

{
code:'0838930764',
name:'NBR O-Ring',
category:'Consumables',
unit:'Nos.',
stock:120,
reorder:25
},

{
code:'0838930774',
name:'FKM O-Ring',
category:'Consumables',
unit:'Nos.',
stock:90,
reorder:25
}

];

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

materials.forEach((item,index)=>{

table.innerHTML += `

<tr>

<td>${item.code}</td>
<td>${item.name}</td>
<td>${item.category}</td>
<td>${item.unit}</td>
<td>${item.stock}</td>
<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">
${
item.stock<=item.reorder
?'Low'
:'Normal'
}
</td>

<td>

<button
class="editBtn"
>
Edit
</button>

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
materials.filter(
m => m.stock<=m.reorder
).length;

document.getElementById(
'todayTransactions'
).innerHTML='0';

}

function scrollToInventory(){

document.getElementById(
'inventorySection'
).scrollIntoView({

behavior:'smooth'

});

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
