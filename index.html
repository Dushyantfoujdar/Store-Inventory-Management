<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Inventory Dashboard</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
color:white;
min-height:100vh;
transition:0.4s;
}

.lightMode{
background:#f1f5f9;
color:black;
}

.app{
padding:20px;
}

h1{
margin-bottom:5px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.card{
flex:1;
min-width:180px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
}

.card p{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.searchBox{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-top:20px;
font-size:16px;
box-sizing:border-box;
}

.tableContainer{
overflow-x:auto;
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
border-radius:20px;
overflow:hidden;
}

th{
background:linear-gradient(to right,#06b6d4,#2563eb);
color:white;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#eff6ff;
}

.low{
color:red;
font-weight:bold;
}

.normal{
color:green;
font-weight:bold;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

.export{
background:linear-gradient(to right,#7c3aed,#5b21b6);
}

.dark{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.panel{
margin-top:25px;
padding:20px;
background:white;
color:black;
border-radius:20px;
display:none;
}

.transactionBox{
margin-top:30px;
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
}

.transaction{
background:white;
color:black;
padding:15px;
border-radius:15px;
margin-top:10px;
}

#reader{
margin-top:20px;
}

canvas{
background:white;
border-radius:20px;
padding:20px;
margin-top:30px;
}

#qrcode{
margin-top:20px;
background:white;
padding:20px;
display:inline-block;
border-radius:20px;
}

.loginPage{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.loginBox{
background:white;
color:black;
padding:30px;
border-radius:20px;
width:300px;
}

.loginBox input{
width:100%;
padding:12px;
margin-top:15px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
}

.loginBox button{
margin-top:20px;
background:#2563eb;
}

@media(max-width:700px){

.cards{
flex-direction:column;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<div id="loginPage" class="loginPage">

<div class="loginBox">

<h2>Store Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

</div>

<div id="mainApp" class="app" style="display:none;">

<h1>Store Inventory Dashboard</h1>

<p>QR Based Inventory Management System</p>

<div class="cards">

<div class="card">
<h3>Low Stock Materials</h3>
<p id="lowStock"></p>
</div>

<div class="card">
<h3>Total Materials</h3>
<p id="totalMaterials"></p>
</div>

</div>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Code</th>
<th>Material</th>
<th>Supplier</th>
<th>Current Stock</th>
<th>Reorder</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<div class="buttons">

<button class="issue" onclick="openPanel('issue')">
Issue
</button>

<button class="receive" onclick="openPanel('receive')">
Receive
</button>

<button class="scan" onclick="startScanner()">
Scan QR
</button>

<button class="export" onclick="downloadPDF()">
PDF
</button>

<button class="export" onclick="exportExcel()">
Excel
</button>

<button class="dark" onclick="toggleMode()">
Dark/Light
</button>

</div>

<div id="transactionPanel" class="panel">

<h2 id="panelTitle"></h2>

<select id="materialSelect" class="searchBox"></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<button
class="scan"
style="margin-top:20px;"
onclick="submitTransaction()"
>
Submit
</button>

</div>

<div id="reader"></div>

<div style="margin-top:25px;">

<button class="scan" onclick="generateQR()">
Generate QR Label
</button>

<div id="qrcode"></div>

</div>

<canvas id="stockChart"></canvas>

<div class="transactionBox">

<h2>Stock History</h2>

<div id="transactions"></div>

</div>

</div>

<script>

let currentUser='';

function login(){

const user=
document.getElementById('username').value;

const pass=
document.getElementById('password').value;

if(user==='admin' && pass==='1234'){

currentUser=user;

document.getElementById('loginPage').style.display='none';

document.getElementById('mainApp').style.display='block';

renderTable();

createChart();

}

else{

alert('Invalid Login');

}

}

const saved =
localStorage.getItem('materials');

const defaultMaterials = [

{
code:'0838181493',
name:'TES',
supplier:'ABC Industries',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve',
supplier:'Valve Tech',
stock:50,
reorder:15
},

{
code:'0838930764',
name:'NBR O Ring',
supplier:'Seal India',
stock:25,
reorder:20
}

];

let materials =
saved ? JSON.parse(saved) : defaultMaterials;

const stockHistory=[];

let currentAction='';

function saveData(){

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

}

function renderTable(){

const table=
document.getElementById('inventoryTable');

table.innerHTML='';

let low=0;

materials.forEach(item=>{

if(item.stock<=item.reorder){

low++;

setTimeout(()=>{

alert(item.name+' is Low Stock');

},500);

}

table.innerHTML+=`

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.supplier}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${item.stock<=item.reorder?'low':'normal'}">

${item.stock<=item.reorder?'Low':'Normal'}

</td>

</tr>

`;

});

document.getElementById('lowStock').innerHTML=
low;

document.getElementById('totalMaterials').innerHTML=
materials.length;

fillDropdown();

saveData();

}

function fillDropdown(){

const dropdown=
document.getElementById('materialSelect');

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML+=`

<option value="${item.code}">

${item.code} - ${item.name}

</option>

`;

});

}

function openPanel(action){

currentAction=action;

document.getElementById('transactionPanel').style.display=
'block';

document.getElementById('panelTitle').innerHTML=
action.toUpperCase()+' Material';

}

function submitTransaction(){

const code=
document.getElementById('materialSelect').value;

const qty=
parseInt(
document.getElementById('qtyInput').value
);

const material=
materials.find(m=>m.code===code);

if(!material || !qty){

alert('Invalid Data');

return;

}

if(currentAction==='issue'){

if(qty>material.stock){

alert('Insufficient Stock');

return;

}

material.stock-=qty;

addHistory(
material.name,
'ISSUE',
qty,
material.stock
);

}

if(currentAction==='receive'){

material.stock+=qty;

addHistory(
material.name,
'RECEIVE',
qty,
material.stock
);

}

renderTable();

createChart();

alert('Transaction Successful');

}

function addHistory(name,action,qty,balance){

stockHistory.push({

name,
action,
qty,
balance,
user:currentUser,
date:new Date().toLocaleString()

});

const div=
document.createElement('div');

div.className='transaction';

div.innerHTML=`

<b>${action}</b> - ${name}

<br>

Qty: ${qty}

<br>

Balance: ${balance}

<br>

User: ${currentUser}

<br>

${new Date().toLocaleString()}

`;

document.getElementById('transactions')
.prepend(div);

}

function searchMaterial(value){

value=value.toLowerCase();

const rows=
document.querySelectorAll('#inventoryTable tr');

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode=
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material=
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

alert('Scanned: '+material.name);

html5QrCode.stop();

}

);

}

function generateQR(){

const code=
prompt('Enter Material Code');

document.getElementById('qrcode').innerHTML='';

new QRCode(
document.getElementById('qrcode'),
{
text:code,
width:200,
height:200
}
);

}

let chart;

function createChart(){

const ctx=
document.getElementById('stockChart');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'bar',

data:{

labels:
materials.map(m=>m.name),

datasets:[{

label:'Current Stock',

data:
materials.map(m=>m.stock),

backgroundColor:'#3b82f6'

}]

}

});

}

function downloadPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

let y=20;

doc.text(
'Store Inventory Report',
10,
10
);

materials.forEach(item=>{

doc.text(

item.name+
' - Stock: '+item.stock,

10,
y

);

y+=10;

});

doc.save('InventoryReport.pdf');

}

function exportExcel(){

const worksheet =
XLSX.utils.json_to_sheet(materials);

const workbook =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
workbook,
worksheet,
'Inventory'
);

XLSX.writeFile(
workbook,
'Inventory.xlsx'
);

}

function toggleMode(){

document.body.classList.toggle('lightMode');

}

</script>

</body>

</html>
