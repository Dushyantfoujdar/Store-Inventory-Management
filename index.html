<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Inventory Dashboard</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
  min-height:100vh;
  color:white;
}

.app{
  padding:20px;
}

h1{
  margin-bottom:5px;
  font-size:34px;
}

.sub{
  opacity:0.9;
  margin-bottom:25px;
}

.cards{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.card{
  flex:1;
  min-width:180px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card h3{
  margin:0;
  font-size:16px;
}

.card p{
  font-size:34px;
  font-weight:bold;
  margin-top:10px;
}

.searchBox{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:none;
  border-radius:15px;
  font-size:16px;
  outline:none;
  box-sizing:border-box;
}

.tableContainer{
  overflow-x:auto;
  margin-top:25px;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  color:black;
  border-radius:20px;
  overflow:hidden;
}

th{
  background:linear-gradient(to right,#06b6d4,#3b82f6);
  color:white;
  padding:16px;
  text-align:left;
}

td{
  padding:16px;
  border-bottom:1px solid #eee;
}

tr:hover{
  background:#f0f9ff;
}

.normal{
  color:green;
  font-weight:bold;
}

.low{
  color:red;
  font-weight:bold;
}

.buttons{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  margin-top:25px;
}

button{
  flex:1;
  padding:16px;
  border:none;
  border-radius:15px;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.03);
}

.issue{
  background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
  background:linear-gradient(to right,#22c55e,#15803d);
}

.scanBtn{
  background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

#reader{
  margin-top:25px;
  border-radius:20px;
  overflow:hidden;
}

.transactionBox{
  margin-top:30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:20px;
}

.transaction{
  background:white;
  color:black;
  padding:15px;
  border-radius:15px;
  margin-top:12px;
}

.greenText{
  color:green;
  font-weight:bold;
}

.redText{
  color:red;
  font-weight:bold;
}

.panel{
  margin-top:25px;
  background:white;
  color:black;
  border-radius:20px;
  padding:20px;
  display:none;
}

.panel h2{
  margin-top:0;
}

.submitBtn{
  background:linear-gradient(to right,#2563eb,#1d4ed8);
  margin-top:20px;
}

@media(max-width:600px){

  .cards{
    flex-direction:column;
  }

  .buttons{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<div class="app">

<h1>Store Inventory Dashboard</h1>

<div class="sub">
QR Based Mobile Inventory Management System
</div>

<div class="cards">

<div class="card">
<h3>Low Stock Materials</h3>
<p id="lowStockCount"></p>
</div>

</div>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>
<tr>
<th>Material Code</th>
<th>Material Name</th>
<th>Unit</th>
<th>Current Stock</th>
<th>Reorder Value</th>
<th>Status</th>
</tr>
</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<div class="buttons">

<button class="issue" onclick="openIssuePanel()">
Issue Material
</button>

<button class="receive" onclick="openReceivePanel()">
Receive Material
</button>

<button class="scanBtn" onclick="openScanPanel()">
Scan QR Code
</button>

</div>

<div id="reader"></div>

<div id="transactionPanel" class="panel">

<h2 id="panelTitle"></h2>

<select id="materialSelect" class="searchBox">

<option value="">
Select Material
</option>

</select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<button
class="submitBtn"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<div class="transactionBox">

<h2>Recent Transactions</h2>

<div id="transactions"></div>

</div>

</div>

<script>

const materials = [

{
code:'0838181493',
name:'TES',
unit:'Nos.',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve New',
unit:'Nos.',
stock:100,
reorder:20
},

{
code:'0838881066',
name:'Combo Valve',
unit:'Nos.',
stock:75,
reorder:20
},

{
code:'0838882104',
name:'LOT Valve',
unit:'Nos.',
stock:60,
reorder:20
},

{
code:'0838911014',
name:'Pressure Regulator',
unit:'Nos.',
stock:40,
reorder:15
},

{
code:'0838920104',
name:'Safety Caps',
unit:'Nos.',
stock:250,
reorder:50
},

{
code:'0838929014',
name:'Nylon Thread',
unit:'Nos.',
stock:150,
reorder:30
},

{
code:'0838929034',
name:'SS Clip',
unit:'Nos.',
stock:80,
reorder:20
},

{
code:'0838930764',
name:'NBR O-Ring',
unit:'Nos.',
stock:120,
reorder:25
},

{
code:'0838930774',
name:'FKM O-Ring',
unit:'Nos.',
stock:90,
reorder:25
},

{
code:'6183050164',
name:'Teflon Tape',
unit:'Nos.',
stock:200,
reorder:40
},

{
code:'8601061404',
name:'Zinc Chrome Primer',
unit:'Litres',
stock:50,
reorder:10
},

{
code:'8614022944',
name:'Paint Enamel Signal Red',
unit:'Litres',
stock:70,
reorder:15
},

{
code:'8614023204',
name:'Paint Enamel White',
unit:'Litres',
stock:65,
reorder:15
},

{
code:'8614023664',
name:'Paint Synthetic Enamel Oxford Blue',
unit:'Litres',
stock:55,
reorder:15
},

{
code:'8630200504',
name:'Thinner F/Enamel Paint',
unit:'Litres',
stock:85,
reorder:20
},

{
code:'8740155404',
name:'Brown Soap F/LPG Conveyor',
unit:'Kg',
stock:45,
reorder:10
},

{
code:'9532500114',
name:'Gloves Hand Cotton 10IN',
unit:'Nos.',
stock:300,
reorder:60
},

{
code:'0838920203',
name:'LOT CAP',
unit:'Nos.',
stock:110,
reorder:25
}

];

let currentAction='';

function renderTable(){

const table=document.getElementById('inventoryTable');

table.innerHTML='';

let lowStock=0;

materials.forEach(item=>{

if(item.stock<item.reorder){
lowStock++;
}

table.innerHTML+=`

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${item.stock<item.reorder?'low':'normal'}">

${item.stock<item.reorder?'Low Stock':'Normal'}

</td>

</tr>

`;

});

document.getElementById('lowStockCount').innerHTML=
lowStock;

}

function fillDropdown(){

const dropdown=
document.getElementById('materialSelect');

dropdown.innerHTML=
'<option value="">Select Material</option>';

materials.forEach(item=>{

dropdown.innerHTML+=`

<option value="${item.code}">

${item.code} - ${item.name}

</option>

`;

});

}

function openIssuePanel(){

currentAction='issue';

document.getElementById('panelTitle').innerHTML=
'Issue Material';

document.getElementById('transactionPanel').style.display=
'block';

fillDropdown();

}

function openReceivePanel(){

currentAction='receive';

document.getElementById('panelTitle').innerHTML=
'Receive Material';

document.getElementById('transactionPanel').style.display=
'block';

fillDropdown();

}

function openScanPanel(){

document.getElementById('transactionPanel').style.display=
'none';

startScanner();

}

function submitTransaction(){

const code=
document.getElementById('materialSelect').value;

const qty=
parseInt(
document.getElementById('qtyInput').value
);

if(!code){
alert('Select material');
return;
}

if(!qty || qty<=0){
alert('Enter valid quantity');
return;
}

const material=
materials.find(m=>m.code===code);

if(!material){
alert('Material not found');
return;
}

if(currentAction==='issue'){

if(qty>material.stock){

alert('Insufficient stock');

return;

}

material.stock-=qty;

addTransaction(
`Issued ${qty} ${material.name}`,
'redText'
);

}

if(currentAction==='receive'){

material.stock+=qty;

addTransaction(
`Received ${qty} ${material.name}`,
'greenText'
);

}

renderTable();

document.getElementById('qtyInput').value='';

document.getElementById('materialSelect').value='';

alert('Transaction Successful');

}

function addTransaction(text,cls){

const transactions=
document.getElementById('transactions');

const div=document.createElement('div');

div.className='transaction';

div.innerHTML=`
<span class="${cls}">${text}</span>
<br>
<small>${new Date().toLocaleString()}</small>
`;

transactions.prepend(div);

}

function searchMaterial(value){

value=value.toLowerCase();

const rows=
document.querySelectorAll('#inventoryTable tr');

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode=
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material=
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

const qty=
parseInt(prompt('Enter quantity'));

if(!qty || qty<=0){

alert('Invalid quantity');

html5QrCode.stop();

return;

}

const action=
prompt('Type ISSUE or RECEIVE');

if(action.toLowerCase()==='issue'){

if(qty>material.stock){

alert('Insufficient stock');

}

else{

material.stock-=qty;

addTransaction(
`QR Issued ${qty} ${material.name}`,
'redText'
);

renderTable();

alert('Material issued successfully');

}

}

else if(action.toLowerCase()==='receive'){

material.stock+=qty;

addTransaction(
`QR Received ${qty} ${material.name}`,
'greenText'
);

renderTable();

alert('Material received successfully');

}

html5QrCode.stop();

}

).catch(err=>{

alert('Camera Error: '+err);

});

}

renderTable();

</script>

</body>
</html>
