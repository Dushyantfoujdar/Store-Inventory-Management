<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Inventory Dashboard</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
color:white;
min-height:100vh;
}

.app{
padding:20px;
}

h1{
margin-bottom:5px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.card{
flex:1;
min-width:200px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.3);
}

.card p{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.searchBox{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-top:20px;
font-size:16px;
box-sizing:border-box;
}

.tableContainer{
overflow-x:auto;
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
border-radius:20px;
overflow:hidden;
}

th{
background:linear-gradient(to right,#06b6d4,#2563eb);
color:white;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#eff6ff;
}

.low{
color:red;
font-weight:bold;
}

.normal{
color:green;
font-weight:bold;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

.panel{
margin-top:25px;
padding:20px;
background:white;
color:black;
border-radius:20px;
display:none;
}

.transactionBox{
margin-top:30px;
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
}

.transaction{
background:white;
color:black;
padding:15px;
border-radius:15px;
margin-top:10px;
}

#reader{
margin-top:20px;
}

@media(max-width:700px){

.cards{
flex-direction:column;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="app">

<h1>Store Inventory Dashboard</h1>

<p>QR Based Inventory Management System</p>

<div class="cards">

<div class="card">
<h3>Total Materials</h3>
<p id="totalMaterials"></p>
</div>

<div class="card">
<h3>Low Stock Materials</h3>
<p id="lowStock"></p>
</div>

</div>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Material Code</th>
<th>Material Name</th>
<th>Unit</th>
<th>Current Stock</th>
<th>Reorder Value</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<div class="buttons">

<button class="issue" onclick="openPanel('issue')">
Issue Material
</button>

<button class="receive" onclick="openPanel('receive')">
Receive Material
</button>

<button class="scan" onclick="startScanner()">
Scan QR
</button>

</div>

<div id="transactionPanel" class="panel">

<h2 id="panelTitle"></h2>

<select id="materialSelect" class="searchBox"></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="scan"
style="margin-top:20px;"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<div id="reader"></div>

<div class="transactionBox">

<h2>Stock History</h2>

<div id="transactions"></div>

</div>

</div>

<script>

const materials = [

{code:'0838181493',name:'TES',unit:'Nos.',stock:95,reorder:20},

{code:'0838880104',name:'SC Valve New',unit:'Nos.',stock:100,reorder:20},

{code:'0838881066',name:'Combo Valve',unit:'Nos.',stock:75,reorder:20},

{code:'0838882104',name:'LOT Valve',unit:'Nos.',stock:60,reorder:20},

{code:'0838911014',name:'Pressure Regulator',unit:'Nos.',stock:40,reorder:15},

{code:'0838920104',name:'Safety Caps',unit:'Nos.',stock:250,reorder:50},

{code:'0838929014',name:'Nylon Thread',unit:'Nos.',stock:150,reorder:30},

{code:'0838929034',name:'SS Clip',unit:'Nos.',stock:80,reorder:20},

{code:'0838930764',name:'NBR O-Ring',unit:'Nos.',stock:120,reorder:25},

{code:'0838930774',name:'FKM O-Ring',unit:'Nos.',stock:90,reorder:25},

{code:'6183050164',name:'Teflon Tape',unit:'Nos.',stock:200,reorder:40},

{code:'8601061404',name:'Zinc Chrome Primer',unit:'Litres',stock:50,reorder:10},

{code:'8614022944',name:'Paint Enamel Signal Red',unit:'Litres',stock:70,reorder:15},

{code:'8614023204',name:'Paint Enamel White',unit:'Litres',stock:65,reorder:15},

{code:'8614023664',name:'Paint Synthetic Enamel Oxford Blue',unit:'Litres',stock:55,reorder:15},

{code:'8630200504',name:'Thinner F/Enamel Paint',unit:'Litres',stock:85,reorder:20},

{code:'8740155404',name:'Brown Soap F/LPG Conveyor',unit:'Kg',stock:45,reorder:10},

{code:'9532500114',name:'Gloves Hand Cotton 10IN',unit:'Nos.',stock:300,reorder:60},

{code:'0838920203',name:'LOT CAP',unit:'Nos.',stock:110,reorder:25}

];

let currentAction='';

function renderTable(){

const table =
document.getElementById('inventoryTable');

table.innerHTML='';

let low=0;

materials.forEach(item=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${item.stock<=item.reorder?'low':'normal'}">

${item.stock<=item.reorder?'Low':'Normal'}

</td>

</tr>

`;

});

document.getElementById('lowStock').innerHTML=low;

document.getElementById('totalMaterials').innerHTML=
materials.length;

fillDropdown();

}

function fillDropdown(){

const dropdown =
document.getElementById('materialSelect');

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

}

function openPanel(action){

currentAction=action;

document.getElementById('transactionPanel').style.display='block';

document.getElementById('panelTitle').innerHTML=
action.toUpperCase()+' Material';

}

function submitTransaction(){

const code =
document.getElementById('materialSelect').value;

const qty =
parseInt(
document.getElementById('qtyInput').value
);

const person =
document.getElementById('personInput').value;

const material =
materials.find(m=>m.code===code);

if(!material || !qty || !person){

alert('Please Fill All Details');

return;

}

if(currentAction==='issue'){

if(qty>material.stock){

alert('Insufficient Stock');

return;

}

material.stock -= qty;

addHistory(
'Issued',
material.name,
qty,
material.stock,
person
);

}

if(currentAction==='receive'){

material.stock += qty;

addHistory(
'Received',
material.name,
qty,
material.stock,
person
);

}

renderTable();

document.getElementById('qtyInput').value='';

document.getElementById('personInput').value='';

alert('Transaction Successful');

}

function addHistory(action,name,qty,balance,person){

const div =
document.createElement('div');

div.className='transaction';

div.innerHTML=`

<b>${action}</b> - ${name}

<br><br>

<b>Quantity:</b> ${qty}

<br>

<b>${action==='Issued'?'Issued To':'Received From'}:</b> ${person}

<br>

<b>Balance Stock:</b> ${balance}

<br>

<b>Date:</b> ${new Date().toLocaleString()}

`;

document.getElementById('transactions')
.prepend(div);

}

function searchMaterial(value){

value=value.toLowerCase();

const rows =
document.querySelectorAll('#inventoryTable tr');

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode =
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material =
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

alert('Scanned: '+material.name);

html5QrCode.stop();

}

);

}

renderTable();

</script>

</body>

</html>
