<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Inventory Dashboard</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#0f766e);
color:white;
min-height:100vh;
transition:0.4s;
}

.lightMode{
background:#f1f5f9;
color:black;
}

.app{
padding:20px;
}

h1{
margin-bottom:5px;
}

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.card{
flex:1;
min-width:180px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card p{
font-size:32px;
font-weight:bold;
margin-top:10px;
}

.searchBox{
width:100%;
padding:15px;
border:none;
border-radius:15px;
margin-top:20px;
font-size:16px;
box-sizing:border-box;
}

.tableContainer{
overflow-x:auto;
margin-top:25px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
border-radius:20px;
overflow:hidden;
}

th{
background:linear-gradient(to right,#06b6d4,#2563eb);
color:white;
padding:15px;
text-align:left;
}

td{
padding:15px;
border-bottom:1px solid #eee;
}

tr:hover{
background:#eff6ff;
}

.low{
color:red;
font-weight:bold;
}

.normal{
color:green;
font-weight:bold;
}

.buttons{
display:flex;
gap:15px;
flex-wrap:wrap;
margin-top:25px;
}

button{
flex:1;
padding:15px;
border:none;
border-radius:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

.export{
background:linear-gradient(to right,#7c3aed,#5b21b6);
}

.dark{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.panel{
margin-top:25px;
padding:20px;
background:white;
color:black;
border-radius:20px;
display:none;
}

.transactionBox{
margin-top:30px;
background:rgba(255,255,255,0.15);
padding:20px;
border-radius:20px;
}

.transaction{
background:white;
color:black;
padding:15px;
border-radius:15px;
margin-top:10px;
}

#reader{
margin-top:20px;
}

canvas{
background:white;
border-radius:20px;
padding:20px;
margin-top:30px;
}

#qrcode{
margin-top:20px;
background:white;
padding:20px;
display:inline-block;
border-radius:20px;
}

@media(max-width:700px){

.cards{
flex-direction:column;
}

.buttons{
flex-direction:column;
}

}

</style>

</head>

<body>

<div id="mainApp" class="app">

<h1>Store Inventory Dashboard</h1>

<p>QR Based Inventory Management System</p>

<div class="cards">

<div class="card">
<h3>Low Stock Materials</h3>
<p id="lowStock"></p>
</div>

<div class="card">
<h3>Total Materials</h3>
<p id="totalMaterials"></p>
</div>

</div>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Code</th>
<th>Material</th>
<th>Current Stock</th>
<th>Reorder Value</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<div class="buttons">

<button class="issue" onclick="openPanel('issue')">
Issue
</button>

<button class="receive" onclick="openPanel('receive')">
Receive
</button>

<button class="scan" onclick="startScanner()">
Scan QR
</button>

<button class="export" onclick="downloadPDF()">
PDF
</button>

<button class="export" onclick="exportExcel()">
Excel
</button>

<button class="dark" onclick="toggleMode()">
Dark/Light
</button>

</div>

<div id="transactionPanel" class="panel">

<h2 id="panelTitle"></h2>

<select id="materialSelect" class="searchBox"></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<button
class="scan"
style="margin-top:20px;"
onclick="submitTransaction()"
>
Submit
</button>

</div>

<div id="reader"></div>

<div style="margin-top:25px;">

<button class="scan" onclick="generateQR()">
Generate QR Label
</button>

<div id="qrcode"></div>

</div>

<canvas id="stockChart"></canvas>

<div class="transactionBox">

<h2>Stock History</h2>

<div id="transactions"></div>

</div>

</div>

<script>

const saved =
localStorage.getItem('materials');

const defaultMaterials = [

{code:'0838181493',name:'TES',stock:95,reorder:20},
{code:'0838880104',name:'SC Valve New',stock:100,reorder:20},
{code:'0838881066',name:'Combo Valve',stock:75,reorder:20},
{code:'0838882104',name:'LOT Valve',stock:60,reorder:20},
{code:'0838911014',name:'Pressure Regulator',stock:40,reorder:15},
{code:'0838920104',name:'Safety Caps',stock:250,reorder:50},
{code:'0838929014',name:'Nylon Thread',stock:150,reorder:30},
{code:'0838929034',name:'SS Clip',stock:80,reorder:20},
{code:'0838930764',name:'NBR O-Ring',stock:120,reorder:25},
{code:'0838930774',name:'FKM O-Ring',stock:90,reorder:25},
{code:'6183050164',name:'Teflon Tape',stock:200,reorder:40},
{code:'8601061404',name:'Zinc Chrome Primer',stock:50,reorder:10},
{code:'8614022944',name:'Paint Enamel Signal Red',stock:70,reorder:15},
{code:'8614023204',name:'Paint Enamel White',stock:65,reorder:15},
{code:'8614023664',name:'Paint Synthetic Enamel Oxford Blue',stock:55,reorder:15},
{code:'8630200504',name:'Thinner F/Enamel Paint',stock:85,reorder:20},
{code:'8740155404',name:'Brown Soap F/LPG Conveyor',stock:45,reorder:10},
{code:'9532500114',name:'Gloves Hand Cotton 10IN',stock:300,reorder:60},
{code:'0838920203',name:'LOT CAP',stock:110,reorder:25},
{code:'0838920404',name:'Spindle',stock:95,reorder:20},
{code:'0838920504',name:'Valve Spring',stock:140,reorder:30},
{code:'0838920604',name:'Rubber Washer',stock:180,reorder:35},
{code:'0838920704',name:'Dust Cap',stock:210,reorder:50},
{code:'0838920804',name:'Hex Nut',stock:500,reorder:100},
{code:'0838920904',name:'MS Bolt',stock:450,reorder:100},
{code:'0838921004',name:'Lubrication Oil',stock:70,reorder:20},
{code:'0838921104',name:'Hydraulic Oil',stock:55,reorder:15},
{code:'0838921204',name:'Grease',stock:90,reorder:20},
{code:'0838921304',name:'Cotton Waste',stock:150,reorder:30},
{code:'0838921404',name:'Cleaning Cloth',stock:180,reorder:40},
{code:'0838921504',name:'Industrial Gloves',stock:220,reorder:50},
{code:'0838921604',name:'Safety Goggles',stock:80,reorder:20},
{code:'0838921704',name:'Face Shield',stock:60,reorder:15},
{code:'0838921804',name:'Fire Extinguisher',stock:25,reorder:10},
{code:'0838921904',name:'Pressure Gauge',stock:45,reorder:10},
{code:'0838922004',name:'Temperature Sensor',stock:30,reorder:10},
{code:'0838922104',name:'Electrical Cable',stock:300,reorder:50},
{code:'0838922204',name:'Cable Tie',stock:500,reorder:100},
{code:'0838922304',name:'MCB Switch',stock:40,reorder:10},
{code:'0838922404',name:'LED Indicator',stock:70,reorder:20},
{code:'0838922504',name:'Push Button',stock:85,reorder:20},
{code:'0838922604',name:'Contact Relay',stock:35,reorder:10},
{code:'0838922704',name:'Bearing',stock:95,reorder:20},
{code:'0838922804',name:'Chain Sprocket',stock:45,reorder:10},
{code:'0838922904',name:'Conveyor Chain',stock:25,reorder:10},
{code:'0838923004',name:'Air Filter',stock:65,reorder:15},
{code:'0838923104',name:'Oil Filter',stock:70,reorder:15},
{code:'0838923204',name:'Water Filter',stock:50,reorder:10}

];

let materials =
saved ? JSON.parse(saved) : defaultMaterials;

let currentAction='';

function saveData(){

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

}

function renderTable(){

const table=
document.getElementById('inventoryTable');

table.innerHTML='';

let low=0;

materials.forEach(item=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML+=`

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${item.stock<=item.reorder?'low':'normal'}">

${item.stock<=item.reorder?'Low':'Normal'}

</td>

</tr>

`;

});

document.getElementById('lowStock').innerHTML=low;

document.getElementById('totalMaterials').innerHTML=
materials.length;

fillDropdown();

saveData();

createChart();

}

function fillDropdown(){

const dropdown=
document.getElementById('materialSelect');

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML+=`

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

}

function openPanel(action){

currentAction=action;

document.getElementById('transactionPanel').style.display=
'block';

document.getElementById('panelTitle').innerHTML=
action.toUpperCase()+' Material';

}

function submitTransaction(){

const code=
document.getElementById('materialSelect').value;

const qty=
parseInt(
document.getElementById('qtyInput').value
);

const material=
materials.find(m=>m.code===code);

if(!material || !qty){

alert('Invalid Data');

return;

}

if(currentAction==='issue'){

if(qty>material.stock){

alert('Insufficient Stock');

return;

}

material.stock-=qty;

addHistory(
'Issued',
material.name,
qty,
material.stock
);

}

if(currentAction==='receive'){

material.stock+=qty;

addHistory(
'Received',
material.name,
qty,
material.stock
);

}

renderTable();

document.getElementById('qtyInput').value='';

alert('Transaction Successful');

}

function addHistory(action,name,qty,balance){

const div=
document.createElement('div');

div.className='transaction';

div.innerHTML=`

<b>${action}</b> - ${name}

<br>

Quantity: ${qty}

<br>

Balance Stock: ${balance}

<br>

${new Date().toLocaleString()}

`;

document.getElementById('transactions')
.prepend(div);

}

function searchMaterial(value){

value=value.toLowerCase();

const rows=
document.querySelectorAll('#inventoryTable tr');

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode=
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material=
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

alert('Scanned: '+material.name);

html5QrCode.stop();

}

);

}

function generateQR(){

const code=
prompt('Enter Material Code');

document.getElementById('qrcode').innerHTML='';

new QRCode(
document.getElementById('qrcode'),
{
text:code,
width:200,
height:200
}
);

}

let chart;

function createChart(){

const ctx=
document.getElementById('stockChart');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'bar',

data:{

labels:
materials.map(m=>m.name),

datasets:[{

label:'Current Stock',

data:
materials.map(m=>m.stock),

backgroundColor:'#2563eb'

}]

}

});

}

function downloadPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

let y=20;

doc.text(
'Inventory Report',
10,
10
);

materials.forEach(item=>{

doc.text(

item.name+
' - Stock: '+item.stock,

10,
y

);

y+=10;

});

doc.save('InventoryReport.pdf');

}

function exportExcel(){

const worksheet =
XLSX.utils.json_to_sheet(materials);

const workbook =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
workbook,
worksheet,
'Inventory'
);

XLSX.writeFile(
workbook,
'Inventory.xlsx'
);

}

function toggleMode(){

document.body.classList.toggle('lightMode');

}

renderTable();

</script>

</body>

</html>
