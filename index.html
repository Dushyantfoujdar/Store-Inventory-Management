<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Inventory ERP Dashboard</title>

<!-- LIBRARIES -->

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

color:white;
min-height:100vh;

}

.app{
padding:20px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.topButtons{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;

margin-top:25px;

position:sticky;

top:0;

z-index:100;

padding-bottom:10px;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

}

.topButtons button{

padding:18px;

border:none;

border-radius:20px;

font-size:16px;

font-weight:bold;

cursor:pointer;

color:white;

transition:0.3s;

box-shadow:
0 10px 25px rgba(0,0,0,0.3);

}

.topButtons button:hover{
transform:translateY(-4px);
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#2563eb,#1d4ed8);
}

.report{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.card{

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

cursor:pointer;

transition:0.3s;

}

.card:hover{
transform:translateY(-5px);
}

.card p{

font-size:38px;

font-weight:bold;

margin-top:15px;

}

.section{

display:none;

margin-top:25px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

animation:fade 0.3s ease;

}

@keyframes fade{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0px);
}

}

.searchBox{

width:100%;

padding:15px;

margin-top:18px;

border:none;

border-radius:15px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;

font-size:15px;

}

.searchBox::placeholder{
color:#ddd;
}

select{
background:#0f172a !important;
color:white !important;
}

option{
background:#0f172a;
color:white;
}

.tableContainer{

overflow-x:auto;

margin-top:25px;

border-radius:20px;

}

table{

width:100%;

border-collapse:collapse;

}

th{

padding:16px;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

}

td{

padding:15px;

border-bottom:
1px solid rgba(255,255,255,0.1);

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.panelButton{

margin-top:20px;

padding:15px;

width:100%;

border:none;

border-radius:15px;

font-size:16px;

font-weight:bold;

cursor:pointer;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

color:white;

}

#qrcode{

background:white;

padding:25px;

border-radius:20px;

margin-top:20px;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

min-height:300px;

color:black;

}

.transaction{

padding:15px;

margin-top:15px;

border-radius:15px;

background:
rgba(255,255,255,0.08);

}

#reader{
margin-top:20px;
}

@media(max-width:768px){

.topButtons{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="app">

<h1>📦 Inventory ERP Dashboard</h1>

<p>Professional QR Based Inventory Management System</p>

<!-- TOP BUTTONS -->

<div class="topButtons">

<button
class="issue"
onclick="toggleSection('transactionSection')"
>
Issue / Receive
</button>

<button
class="receive"
onclick="toggleSection('qrSection')"
>
Generate QR
</button>

<button
class="scan"
onclick="toggleScanner()"
>
Scan QR
</button>

<button
class="report"
onclick="toggleSection('reportSection')"
>
Reports
</button>

</div>

<!-- ISSUE RECEIVE -->

<div
id="transactionSection"
class="section"
>

<h2>Issue / Receive Material</h2>

<select
id="actionSelect"
class="searchBox"
>

<option value="issue">
Issue Material
</option>

<option value="receive">
Receive Material
</option>

</select>

<select
id="materialSelect"
class="searchBox"
></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="panelButton"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<!-- QR SECTION -->

<div
id="qrSection"
class="section"
>

<h2>QR Generator</h2>

<select
id="qrMaterial"
class="searchBox"
></select>

<button
class="panelButton"
onclick="generateQRLabel()"
>
Generate QR
</button>

<button
class="panelButton"
onclick="downloadQR()"
>
Download QR PNG
</button>

<div id="qrcode"></div>

</div>

<!-- SCANNER -->

<div
id="scannerSection"
class="section"
>

<h2>QR Scanner</h2>

<div id="reader"></div>

</div>

<!-- REPORT SECTION -->

<div
id="reportSection"
class="section"
>

<h2>Material Transaction Reports</h2>

<select
id="reportMaterial"
class="searchBox"
></select>

<input
type="date"
id="fromDate"
class="searchBox"
>

<input
type="date"
id="toDate"
class="searchBox"
>

<button
class="panelButton"
onclick="generateHistory()"
>
Generate Report
</button>

<button
class="panelButton"
onclick="downloadExcel()"
>
Download Excel
</button>

<button
class="panelButton"
onclick="downloadPDF()"
>
Download PDF
</button>

<div id="historyContainer"></div>

</div>

<!-- KPI CARDS -->

<div class="cards">

<div class="card">

<h3>Total Materials</h3>

<p id="totalMaterials"></p>

</div>

<div
class="card"
onclick="showLowStock()"
>

<h3>Low Stock</h3>

<p id="lowStock"></p>

</div>

<div class="card">

<h3>Total Inventory</h3>

<p id="totalStock"></p>

</div>

<div class="card">

<h3>Total Transactions</h3>

<p id="totalTransactions"></p>

</div>

</div>

<!-- INVENTORY TABLE -->

<div class="section" style="display:block;">

<h2>Inventory Table</h2>

<input
type="text"
class="searchBox"
placeholder="Search Material"
onkeyup="searchMaterial(this.value)"
>

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Code</th>
<th>Name</th>
<th>Category</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

</div>

</div>

<script>

let materials=[

{
code:'0838181493',
name:'TES',
category:'Valves',
unit:'Nos.',
stock:95,
reorder:20
},

{
code:'0838880104',
name:'SC Valve New',
category:'Valves',
unit:'Nos.',
stock:100,
reorder:20
},

{
code:'0838881066',
name:'Combo Valve',
category:'Valves',
unit:'Nos.',
stock:75,
reorder:20
},

{
code:'0838882104',
name:'LOT Valve',
category:'Valves',
unit:'Nos.',
stock:60,
reorder:20
},

{
code:'0838911014',
name:'Pressure Regulator',
category:'Safety',
unit:'Nos.',
stock:40,
reorder:15
},

{
code:'0838920104',
name:'Safety Caps',
category:'Safety',
unit:'Nos.',
stock:250,
reorder:50
},

{
code:'0838929014',
name:'Nylon Thread',
category:'Consumables',
unit:'Nos.',
stock:150,
reorder:30
},

{
code:'0838929034',
name:'SS Clip',
category:'Consumables',
unit:'Nos.',
stock:80,
reorder:20
},

{
code:'0838930764',
name:'NBR O-Ring',
category:'Consumables',
unit:'Nos.',
stock:120,
reorder:25
},

{
code:'0838930774',
name:'FKM O-Ring',
category:'Consumables',
unit:'Nos.',
stock:90,
reorder:25
}

];

let transactionHistory=
JSON.parse(
localStorage.getItem('transactions')
)||[];

function saveData(){

localStorage.setItem(
'transactions',
JSON.stringify(transactionHistory)
);

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

}

function toggleSection(id){

const section=
document.getElementById(id);

const visible=
section.style.display==='block';

hideSections();

section.style.display=
visible?'none':'block';

}

function hideSections(){

document.querySelectorAll(
'.section'
).forEach(sec=>{

if(
sec.id!==''
){
sec.style.display='none';
}

});

document.querySelectorAll(
'.section'
)[4].style.display='block';

}

function toggleScanner(){

toggleSection('scannerSection');

document.getElementById(
'reader'
).innerHTML='';

const html5QrCode =
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

try{

const qrData=
JSON.parse(decodedText);

const material=
materials.find(
m => m.code===qrData.code
);

if(material){

html5QrCode.stop();

toggleSection(
'transactionSection'
);

document.getElementById(
'materialSelect'
).value=
material.code;

Swal.fire(
'QR Scanned',
material.name,
'success'
);

}

}
catch(err){

Swal.fire(
'Error',
'Invalid QR',
'error'
);

}

}

);

}

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

let low=0;
let total=0;

materials.forEach(item=>{

total += item.stock;

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.category}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">

${
item.stock<=item.reorder
?'Low'
:'Normal'
}

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
low;

document.getElementById(
'totalStock'
).innerHTML=
total;

document.getElementById(
'totalTransactions'
).innerHTML=
transactionHistory.length;

fillDropdowns();

}

function fillDropdowns(){

const ids=[
'materialSelect',
'qrMaterial',
'reportMaterial'
];

ids.forEach(id=>{

const dropdown=
document.getElementById(id);

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

});

}

function submitTransaction(){

const action=
document.getElementById(
'actionSelect'
).value;

const code=
document.getElementById(
'materialSelect'
).value;

const qty=
parseInt(
document.getElementById(
'qtyInput'
).value
);

const person=
document.getElementById(
'personInput'
).value;

const material=
materials.find(
m => m.code===code
);

if(!qty || !person){

Swal.fire(
'Error',
'Fill all details',
'error'
);

return;

}

if(action==='issue'){

if(qty>material.stock){

Swal.fire(
'Error',
'Insufficient Stock',
'error'
);

return;

}

material.stock -= qty;

}
else{

material.stock += qty;

}

transactionHistory.unshift({

material:material.name,

action:action,

qty:qty,

person:person,

balance:material.stock,

date:new Date().toLocaleString()

});

saveData();

renderTable();

Swal.fire(
'Success',
'Transaction Successful',
'success'
);

}

function generateQRLabel(){

const code=
document.getElementById(
'qrMaterial'
).value;

const material=
materials.find(
m => m.code===code
);

const qrDiv=
document.getElementById(
'qrcode'
);

qrDiv.innerHTML='';

const canvas=
document.createElement(
'canvas'
);

qrDiv.appendChild(canvas);

const qrData=
JSON.stringify({

code:material.code,

name:material.name

});

QRCode.toCanvas(

canvas,

qrData,

{
width:220
},

function(error){

if(error){

Swal.fire(
'Error',
'QR Generation Failed',
'error'
);

return;

}

const label=
document.createElement('div');

label.innerHTML=`

<h3>
${material.name}
</h3>

<p>
${material.code}
</p>

`;

qrDiv.appendChild(label);

}

);

}

function downloadQR(){

html2canvas(
document.getElementById(
'qrcode'
)

).then(canvas=>{

const link=
document.createElement('a');

link.download='QR.png';

link.href=
canvas.toDataURL();

link.click();

});

}

function generateHistory(){

const container=
document.getElementById(
'historyContainer'
);

container.innerHTML='';

transactionHistory.forEach(item=>{

container.innerHTML += `

<div class="transaction">

<b>${item.material}</b>

<br><br>

Action:
${item.action}

<br>

Quantity:
${item.qty}

<br>

Person:
${item.person}

<br>

Balance:
${item.balance}

<br>

Date:
${item.date}

</div>

`;

});

}

function downloadExcel(){

const ws=
XLSX.utils.json_to_sheet(
transactionHistory
);

const wb=
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
wb,
ws,
'Transactions'
);

XLSX.writeFile(
wb,
'Inventory_Report.xlsx'
);

}

function downloadPDF(){

const { jsPDF }=
window.jspdf;

const pdf=
new jsPDF();

pdf.text(
'Inventory Report',
20,
20
);

let y=40;

transactionHistory.forEach(item=>{

pdf.text(

`${item.material}
 | ${item.action}
 | Qty:${item.qty}`,

10,
y

);

y += 10;

});

pdf.save(
'Inventory_Report.pdf'
);

}

function searchMaterial(value){

value=
value.toLowerCase();

const rows=
document.querySelectorAll(
'#inventoryTable tr'
);

rows.forEach(row=>{

if(
row.innerText
.toLowerCase()
.includes(value)
){

row.style.display='';

}
else{

row.style.display='none';

}

});

}

function showLowStock(){

const low=
materials.filter(
m => m.stock<=m.reorder
);

let text='';

low.forEach(item=>{

text += `
${item.name}
 - Stock:
${item.stock}<br>
`;

});

Swal.fire({

title:'Low Stock Materials',

html:text ||

'No Low Stock',

icon:'warning'

});

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
