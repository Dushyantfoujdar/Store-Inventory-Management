<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Inventory ERP Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

color:white;
min-height:100vh;

}

.app{
padding:20px;
}

h1{
font-size:34px;
margin-bottom:10px;
text-align:center;
}

.mainText{
text-align:center;
margin-bottom:20px;
}

.topButtons{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:15px;
margin-top:25px;

}

.topButtons button{

padding:18px;
border:none;
border-radius:20px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
transition:0.3s;

box-shadow:
0 10px 25px rgba(0,0,0,0.3);

}

.topButtons button:hover{
transform:translateY(-4px);
}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#2563eb,#1d4ed8);
}

.report{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.materialBtn{
background:linear-gradient(to right,#7c3aed,#5b21b6);
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;
margin-top:30px;

}

.card{

padding:25px;
border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

cursor:pointer;
transition:0.3s;

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

text-align:center;

}

.card:hover{
transform:translateY(-5px);
}

.card p{

font-size:38px;
font-weight:bold;
margin-top:15px;

}

.tableContainer{

overflow-x:auto;
margin-top:25px;
border-radius:20px;

}

table{

width:100%;
border-collapse:collapse;
text-align:center;

}

th{

padding:16px;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

text-align:center;

}

td{

padding:15px;

border-bottom:
1px solid rgba(255,255,255,0.1);

text-align:center;
vertical-align:middle;

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.editBtn{

padding:8px 14px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;

}

.editBtn:hover{
background:#1d4ed8;
}

.popupOverlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
rgba(0,0,0,0.7);

display:none;

align-items:center;
justify-content:center;

z-index:9999;
padding:20px;

overflow:auto;

}

.popupBox{

width:100%;
max-width:600px;

background:
linear-gradient(
135deg,
#0f172a,
#1e293b,
#1d4ed8,
#0f766e
);

padding:25px;
border-radius:25px;

box-shadow:
0 10px 40px rgba(0,0,0,0.5);

}

.popupTop{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;

}

.closePopup{

background:red;
border:none;
color:white;

padding:10px 15px;

border-radius:10px;
cursor:pointer;
font-weight:bold;

}

.searchBox{

width:100%;

padding:15px;

margin-top:15px;

border:none;
border-radius:15px;

background:
rgba(255,255,255,0.08);

color:white;

outline:none;
font-size:15px;

}

.searchBox::placeholder{
color:#ddd;
}

.panelButton{

margin-top:20px;

padding:15px;
width:100%;

border:none;
border-radius:15px;

font-size:16px;
font-weight:bold;

cursor:pointer;

background:
linear-gradient(
to right,
#2563eb,
#06b6d4
);

color:white;

}

select{
background:#0f172a !important;
color:white !important;
}

option{
background:#0f172a;
color:white;
}

#qrcode{

background:white;
padding:20px;
border-radius:20px;
margin-top:20px;

display:flex;
flex-direction:column;

align-items:center;
justify-content:center;

color:black;

min-height:250px;

}

.transaction{

padding:15px;
margin-top:15px;

border-radius:15px;

background:
rgba(255,255,255,0.08);

text-align:center;

}

@media(max-width:768px){

.topButtons{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="app">

<h1>📦 Inventory ERP Dashboard</h1>

<p class="mainText">
Professional QR Based Inventory Management System
</p>

<div class="topButtons">

<button
class="issue"
onclick="openTransactionPopup()"
>
Issue / Receive
</button>

<button
class="receive"
onclick="openQRPopup()"
>
Generate QR
</button>

<button
class="scan"
onclick="openScannerPopup()"
>
Scan QR
</button>

<button
class="report"
onclick="openReportPopup()"
>
Reports
</button>

<button
class="materialBtn"
onclick="openMaterialPopup()"
>
Add Material
</button>

</div>

<div class="cards">

<div class="card">
<h3>Total Materials</h3>
<p id="totalMaterials"></p>
</div>

<div
class="card"
onclick="showLowStock()"
>
<h3>Low Stock</h3>
<p id="lowStock"></p>
</div>

<div class="card">
<h3>Today's Transactions</h3>
<p id="todayTransactions"></p>
</div>

</div>

<div class="tableContainer">

<table>

<thead>

<tr>

<th>Code</th>
<th>Name</th>
<th>Category</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
<th>Edit</th>

</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

</div>

<!-- ISSUE RECEIVE POPUP -->

<div
id="transactionPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Issue / Receive Material</h2>

<button
class="closePopup"
onclick="closePopup('transactionPopup')"
>
X
</button>

</div>

<select
id="actionSelect"
class="searchBox"
>

<option value="issue">
Issue Material
</option>

<option value="receive">
Receive Material
</option>

</select>

<select
id="materialSelect"
class="searchBox"
></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="panelButton"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

</div>

<!-- QR POPUP -->

<div
id="qrPopup"
class="popupOverlay"
>

<div class="popupBox">

<div class="popupTop">

<h2>Generate QR</h2>

<button
class="closePopup"
onclick="closePopup('qrPopup')"
>
X
</button>

</div>

<select
id="qrMaterial"
class="searchBox"
></select>

<button
class="panelButton"
onclick="generateQRLabel()"
>
Generate QR
</button>

<button
class="panelButton"
onclick="downloadQR()"
>
Download QR
</button>

<div id="qrcode"></div>

</div>

</div>

<script>

let materials=[

{code:'0838181493',name:'TES',category:'Valves',unit:'Nos.',stock:95,reorder:20},

{code:'0838880104',name:'SC Valve New',category:'Valves',unit:'Nos.',stock:100,reorder:20},

{code:'0838881066',name:'Combo Valve',category:'Valves',unit:'Nos.',stock:75,reorder:20},

{code:'0838882104',name:'LOT Valve',category:'Valves',unit:'Nos.',stock:60,reorder:20},

{code:'0838911014',name:'Pressure Regulator',category:'Safety',unit:'Nos.',stock:40,reorder:15},

{code:'0838920104',name:'Safety Caps',category:'Safety',unit:'Nos.',stock:250,reorder:50},

{code:'0838929014',name:'Nylon Thread',category:'Consumables',unit:'Nos.',stock:150,reorder:30},

{code:'0838929034',name:'SS Clip',category:'Consumables',unit:'Nos.',stock:80,reorder:20},

{code:'0838930764',name:'NBR O-Ring',category:'Consumables',unit:'Nos.',stock:120,reorder:25},

{code:'0838930774',name:'FKM O-Ring',category:'Consumables',unit:'Nos.',stock:90,reorder:25},

{code:'6183050164',name:'Teflon Tape',category:'Consumables',unit:'Nos.',stock:200,reorder:40},

{code:'8601061404',name:'Zinc Chrome Primer',category:'Paint',unit:'Litres',stock:50,reorder:10},

{code:'8614022944',name:'Paint Enamel Signal Red',category:'Paint',unit:'Litres',stock:70,reorder:15},

{code:'8614023204',name:'Paint Enamel White',category:'Paint',unit:'Litres',stock:65,reorder:15},

{code:'8614023664',name:'Paint Synthetic Enamel Oxford Blue',category:'Paint',unit:'Litres',stock:55,reorder:15},

{code:'8630200504',name:'Thinner F/Enamel Paint',category:'Paint',unit:'Litres',stock:85,reorder:20},

{code:'8740155404',name:'Brown Soap F/LPG Conveyor',category:'Cleaning',unit:'Kg',stock:45,reorder:10},

{code:'9532500114',name:'Gloves Hand Cotton 10IN',category:'Safety',unit:'Nos.',stock:300,reorder:60},

{code:'0838920203',name:'LOT CAP',category:'Valves',unit:'Nos.',stock:110,reorder:25}

];

let transactionHistory=[];

function renderTable(){

const table=
document.getElementById(
'inventoryTable'
);

table.innerHTML='';

let low=0;

materials.forEach((item,index)=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.category}</td>

<td>${item.unit}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder
?'low'
:'normal'
}">
${
item.stock<=item.reorder
?'Low'
:'Normal'
}
</td>

<td style="text-align:center;">

<button
class="editBtn"
onclick="editMaterial(${index})"
>
Edit
</button>

</td>

</tr>

`;

});

document.getElementById(
'totalMaterials'
).innerHTML=
materials.length;

document.getElementById(
'lowStock'
).innerHTML=
low;

document.getElementById(
'todayTransactions'
).innerHTML=
transactionHistory.length;

fillDropdowns();

}

function fillDropdowns(){

const ids=[
'materialSelect',
'qrMaterial'
];

ids.forEach(id=>{

const dropdown=
document.getElementById(id);

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

});

}

function openTransactionPopup(){

document.getElementById(
'transactionPopup'
).style.display='flex';

}

function openQRPopup(){

document.getElementById(
'qrPopup'
).style.display='flex';

}

function openScannerPopup(){

Swal.fire(
'Scanner Ready',
'QR Scanner Opened',
'success'
);

}

function openReportPopup(){

Swal.fire(
'Reports',
'Reports Popup Opened',
'success'
);

}

function openMaterialPopup(){

Swal.fire(
'Add Material',
'Material Popup Opened',
'success'
);

}

function closePopup(id){

document.getElementById(id)
.style.display='none';

}

function submitTransaction(){

const action=
document.getElementById(
'actionSelect'
).value;

const code=
document.getElementById(
'materialSelect'
).value;

const qty=
parseInt(
document.getElementById(
'qtyInput'
).value
);

const person=
document.getElementById(
'personInput'
).value;

const material=
materials.find(
m => m.code===code
);

if(!qty || !person){

Swal.fire(
'Error',
'Fill all details',
'error'
);

return;

}

if(action==='issue'){

if(qty>material.stock){

Swal.fire(
'Error',
'Insufficient Stock',
'error'
);

return;

}

material.stock -= qty;

}
else{

material.stock += qty;

}

transactionHistory.unshift({

material:material.name,
qty:qty,
person:person,
action:action,
date:new Date()

});

renderTable();

closePopup(
'transactionPopup'
);

Swal.fire(
'Success',
'Transaction Successful',
'success'
);

}

function generateQRLabel(){

const code=
document.getElementById(
'qrMaterial'
).value;

const material=
materials.find(
m => m.code===code
);

const qrDiv=
document.getElementById(
'qrcode'
);

qrDiv.innerHTML='';

const canvas=
document.createElement(
'canvas'
);

qrDiv.appendChild(canvas);

QRCode.toCanvas(

canvas,

JSON.stringify({

code:material.code,
name:material.name

}),

{
width:220
},

function(error){

if(error){

Swal.fire(
'Error',
'QR Generation Failed',
'error'
);

return;

}

const label=
document.createElement('div');

label.innerHTML=`

<h3>${material.name}</h3>
<p>${material.code}</p>

`;

qrDiv.appendChild(label);

}

);

}

function downloadQR(){

html2canvas(
document.getElementById(
'qrcode'
)

).then(canvas=>{

const link=
document.createElement('a');

link.download='QR.png';

link.href=
canvas.toDataURL();

link.click();

});

}

function editMaterial(index){

Swal.fire(
'Edit Material',
materials[index].name,
'info'
);

}

function showLowStock(){

const low=
materials.filter(
m => m.stock<=m.reorder
);

let text='';

low.forEach(item=>{

text += `
${item.name}
 - Stock:
${item.stock}<br>
`;

});

Swal.fire({

title:'Low Stock Materials',
html:text ||
'No Low Stock',
icon:'warning'

});

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
