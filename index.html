<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advanced Inventory Dashboard</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Segoe UI',sans-serif;

background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e3a8a,
#0f766e
);

background-size:400% 400%;

animation:bgmove 15s ease infinite;

color:white;

min-height:100vh;

}

@keyframes bgmove{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.app{
padding:25px;
}

h1{
font-size:38px;
margin-bottom:10px;
}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:25px;

}

.card{

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

border:
1px solid rgba(255,255,255,0.12);

box-shadow:
0 10px 30px rgba(0,0,0,0.3);

}

.card p{
font-size:40px;
font-weight:bold;
margin-top:15px;
}

.searchBox{

width:100%;

padding:16px;

margin-top:20px;

border:none;

border-radius:18px;

font-size:16px;

background:
rgba(255,255,255,0.1);

color:white;

outline:none;

}

.searchBox::placeholder{
color:#ddd;
}

.tableContainer{

margin-top:30px;

overflow-x:auto;

padding:10px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

}

table{
width:100%;
border-collapse:collapse;
color:white;
}

th{

padding:18px;

text-align:left;

background:
linear-gradient(
to right,
#06b6d4,
#2563eb,
#7c3aed
);

}

td{

padding:16px;

border-bottom:
1px solid rgba(255,255,255,0.1);

}

tr:hover{
background:rgba(255,255,255,0.05);
}

.low{
color:#ff4d6d;
font-weight:bold;
}

.normal{
color:#4ade80;
font-weight:bold;
}

.buttons{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-top:30px;

}

button{

flex:1;

padding:16px;

border:none;

border-radius:18px;

font-size:15px;

font-weight:bold;

cursor:pointer;

color:white;

transition:0.3s;

}

button:hover{

transform:translateY(-3px);

opacity:0.95;

}

.issue{
background:linear-gradient(to right,#ef4444,#dc2626);
}

.receive{
background:linear-gradient(to right,#22c55e,#15803d);
}

.scan{
background:linear-gradient(to right,#3b82f6,#1d4ed8);
}

.theme{
background:linear-gradient(to right,#8b5cf6,#6d28d9);
}

.download{
background:linear-gradient(to right,#f59e0b,#d97706);
}

.panel{

margin-top:30px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

display:none;

}

.transactionBox{

margin-top:35px;

padding:25px;

border-radius:25px;

background:
rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

}

.transaction{

padding:18px;

border-radius:18px;

margin-top:15px;

background:
rgba(255,255,255,0.08);

}

.filterBox{

display:flex;

gap:15px;

flex-wrap:wrap;

margin-top:20px;

}

#qrcode{

margin-top:25px;

padding:25px;

border-radius:20px;

background:
rgba(255,255,255,0.08);

display:inline-block;

}

.light-mode{
background:#f1f5f9;
color:black;
}

.light-mode .card,
.light-mode .panel,
.light-mode .transactionBox,
.light-mode .tableContainer,
.light-mode #qrcode{
background:white;
color:black;
}

.light-mode table{
color:black;
}

.light-mode .searchBox{
background:#f1f5f9;
color:black;
}

@media(max-width:768px){

.buttons,
.filterBox{
flex-direction:column;
}

}

</style>

</head>

<body>

<div class="app" id="dashboard">

<h1>Store Inventory Dashboard</h1>

<p>QR Based Inventory Management System</p>

<div class="cards">

<div class="card">
<h3>Total Materials</h3>
<p id="totalMaterials"></p>
</div>

<div class="card">
<h3>Low Stock Materials</h3>
<p id="lowStock"></p>
</div>

</div>

<input

type="text"

class="searchBox"

placeholder="Search Material"

onkeyup="searchMaterial(this.value)"

>

<div class="tableContainer">

<table>

<thead>

<tr>
<th>Material Code</th>
<th>Material Name</th>
<th>Unit</th>
<th>Stock</th>
<th>Reorder</th>
<th>Status</th>
</tr>

</thead>

<tbody id="inventoryTable"></tbody>

</table>

</div>

<div class="buttons">

<button class="issue" onclick="openPanel('issue')">
Issue Material
</button>

<button class="receive" onclick="openPanel('receive')">
Receive Material
</button>

<button class="scan" onclick="startScanner()">
Scan QR
</button>

<button class="receive" onclick="openQRPanel()">
Generate QR
</button>

<button class="theme" onclick="toggleTheme()">
Dark / Light
</button>

<button class="download" onclick="downloadPNG()">
Download PNG
</button>

<button class="download" onclick="downloadJPG()">
Download JPG
</button>

<button class="download" onclick="downloadPDF()">
Download PDF
</button>

</div>

<div id="transactionPanel" class="panel">

<h2 id="panelTitle"></h2>

<select id="materialSelect" class="searchBox"></select>

<input
type="number"
id="qtyInput"
class="searchBox"
placeholder="Enter Quantity"
>

<input
type="text"
id="personInput"
class="searchBox"
placeholder="Issued To / Received From"
>

<button
class="scan"
style="margin-top:20px;"
onclick="submitTransaction()"
>
Submit Transaction
</button>

</div>

<div id="qrPanel" class="panel">

<h2>QR Label Generator</h2>

<select id="qrMaterial" class="searchBox"></select>

<button
class="scan"
style="margin-top:20px;"
onclick="generateQRLabel()"
>
Generate QR Label
</button>

<div id="qrcode"></div>

</div>

<div id="reader"></div>

<div class="transactionBox">

<h2>Material Wise Report</h2>

<div class="filterBox">

<select id="reportMaterial" class="searchBox"></select>

<input
type="date"
id="fromDate"
class="searchBox"
>

<input
type="date"
id="toDate"
class="searchBox"
>

<button
class="scan"
onclick="generateReport()"
>
Generate Report
</button>

</div>

<div id="reportResults"></div>

</div>

</div>

<script>

const defaultMaterials=[

{code:'0838181493',name:'TES',unit:'Nos.',stock:95,reorder:20},

{code:'0838880104',name:'SC Valve New',unit:'Nos.',stock:100,reorder:20},

{code:'0838881066',name:'Combo Valve',unit:'Nos.',stock:75,reorder:20},

{code:'0838882104',name:'LOT Valve',unit:'Nos.',stock:60,reorder:20},

{code:'0838911014',name:'Pressure Regulator',unit:'Nos.',stock:40,reorder:15},

{code:'0838920104',name:'Safety Caps',unit:'Nos.',stock:250,reorder:50},

{code:'0838929014',name:'Nylon Thread',unit:'Nos.',stock:150,reorder:30},

{code:'0838929034',name:'SS Clip',unit:'Nos.',stock:80,reorder:20},

{code:'0838930764',name:'NBR O-Ring',unit:'Nos.',stock:120,reorder:25},

{code:'0838930774',name:'FKM O-Ring',unit:'Nos.',stock:90,reorder:25},

{code:'6183050164',name:'Teflon Tape',unit:'Nos.',stock:200,reorder:40},

{code:'8601061404',name:'Zinc Chrome Primer',unit:'Litres',stock:50,reorder:10},

{code:'8614022944',name:'Paint Enamel Signal Red',unit:'Litres',stock:70,reorder:15},

{code:'8614023204',name:'Paint Enamel White',unit:'Litres',stock:65,reorder:15},

{code:'8614023664',name:'Paint Synthetic Enamel Oxford Blue',unit:'Litres',stock:55,reorder:15},

{code:'8630200504',name:'Thinner F/Enamel Paint',unit:'Litres',stock:85,reorder:20},

{code:'8740155404',name:'Brown Soap F/LPG Conveyor',unit:'Kg',stock:45,reorder:10},

{code:'9532500114',name:'Gloves Hand Cotton 10IN',unit:'Nos.',stock:300,reorder:60},

{code:'0838920203',name:'LOT CAP',unit:'Nos.',stock:110,reorder:25}

];

let materials=
JSON.parse(localStorage.getItem('materials'))
|| defaultMaterials;

let transactionHistory=
JSON.parse(localStorage.getItem('transactions'))
|| [];

let currentAction='';

let currentReportData=[];

function saveData(){

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

localStorage.setItem(
'transactions',
JSON.stringify(transactionHistory)
);

}

function renderTable(){

const table=
document.getElementById('inventoryTable');

table.innerHTML='';

let low=0;

materials.forEach(item=>{

if(item.stock<=item.reorder){
low++;
}

table.innerHTML += `

<tr>

<td>${item.code}</td>
<td>${item.name}</td>
<td>${item.unit}</td>
<td>${item.stock}</td>
<td>${item.reorder}</td>

<td class="${
item.stock<=item.reorder?'low':'normal'
}">

${
item.stock<=item.reorder?'Low':'Normal'
}

</td>

</tr>

`;

});

document.getElementById('totalMaterials').innerHTML=
materials.length;

document.getElementById('lowStock').innerHTML=
low;

fillDropdowns();

}

function fillDropdowns(){

const materialSelect=
document.getElementById('materialSelect');

const reportMaterial=
document.getElementById('reportMaterial');

const qrMaterial=
document.getElementById('qrMaterial');

materialSelect.innerHTML='';

reportMaterial.innerHTML='';

qrMaterial.innerHTML='';

materials.forEach(item=>{

materialSelect.innerHTML += `
<option value="${item.code}">
${item.code} - ${item.name}
</option>
`;

reportMaterial.innerHTML += `
<option value="${item.name}">
${item.name}
</option>
`;

qrMaterial.innerHTML += `
<option value="${item.code}">
${item.code} - ${item.name}
</option>
`;

});

}

function openPanel(action){

currentAction=action;

document.getElementById(
'transactionPanel'
).style.display='block';

document.getElementById(
'panelTitle'
).innerHTML=
action.toUpperCase()+' Material';

}

function submitTransaction(){

const code=
document.getElementById('materialSelect').value;

const qty=
parseInt(
document.getElementById('qtyInput').value
);

const person=
document.getElementById('personInput').value;

const material=
materials.find(m=>m.code===code);

if(!qty || !person){

alert('Fill All Details');

return;

}

if(currentAction==='issue'){

if(qty>material.stock){

alert('Insufficient Stock');

return;

}

material.stock -= qty;

addHistory(
'Issued',
material.name,
qty,
material.stock,
person
);

}

if(currentAction==='receive'){

material.stock += qty;

addHistory(
'Received',
material.name,
qty,
material.stock,
person
);

}

saveData();

renderTable();

alert('Transaction Successful');

}

function addHistory(action,name,qty,balance,person){

transactionHistory.unshift({

action,
name,
qty,
balance,
person,
time:new Date()

});

saveData();

}

function generateReport(){

const material=
document.getElementById('reportMaterial').value;

const from=
document.getElementById('fromDate').value;

const to=
document.getElementById('toDate').value;

if(!from || !to){

alert('Select Dates');

return;

}

const fromDate=new Date(from);

const toDate=new Date(to);

toDate.setHours(23,59,59,999);

currentReportData=
transactionHistory.filter(item=>{

const d=new Date(item.time);

return item.name===material &&
d>=fromDate &&
d<=toDate;

});

const container=
document.getElementById('reportResults');

container.innerHTML='';

if(currentReportData.length===0){

container.innerHTML=
'<div class="transaction">No Transactions Found</div>';

return;

}

currentReportData.forEach(item=>{

container.innerHTML += `

<div class="transaction">

<b>${item.action}</b> - ${item.name}

<br><br>

<b>Qty:</b> ${item.qty}

<br>

<b>Person:</b> ${item.person}

<br>

<b>Balance:</b> ${item.balance}

<br>

<b>Date:</b>

${new Date(item.time).toLocaleString()}

</div>

`;

});

}

function searchMaterial(value){

value=value.toLowerCase();

const rows=
document.querySelectorAll(
'#inventoryTable tr'
);

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode=
new Html5Qrcode('reader');

html5QrCode.start(

{facingMode:'environment'},

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material=
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

alert('Scanned: '+material.name);

html5QrCode.stop();

}

);

}

function openQRPanel(){

document.getElementById(
'qrPanel'
).style.display='block';

}

function generateQRLabel(){

const code=
document.getElementById('qrMaterial').value;

const material=
materials.find(m=>m.code===code);

const qrDiv=
document.getElementById('qrcode');

qrDiv.innerHTML='';

new QRCode(qrDiv,{

text:
`${material.code} - ${material.name}`,

width:200,

height:200

});

qrDiv.innerHTML += `

<p>

<b>${material.code}</b>

<br>

${material.name}

</p>

`;

}

function toggleTheme(){

document.body.classList.toggle(
'light-mode'
);

}

async function downloadPNG(){

const canvas=
await html2canvas(
document.getElementById('dashboard')
);

const link=
document.createElement('a');

link.download='InventoryDashboard.png';

link.href=
canvas.toDataURL('image/png');

link.click();

}

async function downloadJPG(){

const canvas=
await html2canvas(
document.getElementById('dashboard')
);

const link=
document.createElement('a');

link.download='InventoryDashboard.jpg';

link.href=
canvas.toDataURL('image/jpeg',1);

link.click();

}

async function downloadPDF(){

const canvas=
await html2canvas(
document.getElementById('dashboard')
);

const imgData=
canvas.toDataURL('image/png');

const { jsPDF }=
window.jspdf;

const pdf=
new jsPDF('p','mm','a4');

const width=210;

const height=
(canvas.height * width)
/ canvas.width;

pdf.addImage(
imgData,
'PNG',
0,
0,
width,
height
);

pdf.save('InventoryDashboard.pdf');

}

window.onload=function(){

renderTable();

};

</script>

</body>

</html>
