# Multi-Material Store Inventory Dashboard

<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Store Inventory Dashboard</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dff6ff, #ffffff);
    }

    .app {
      padding: 20px;
    }

    h1 {
      color: #003566;
      margin-bottom: 5px;
    }

    .sub {
      color: #555;
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      flex: 1;
      min-width: 150px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card p {
      font-size: 30px;
      color: #3a0ca3;
      font-weight: bold;
    }

    .searchBox {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-top: 20px;
      box-sizing: border-box;
      font-size: 16px;
    }

    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    th {
      background: #caf0f8;
      padding: 15px;
      text-align: left;
    }

    td {
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .normal {
      color: green;
      font-weight: bold;
    }

    .low {
      color: red;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
    }

    .issue {
      background: #ef233c;
    }

    .receive {
      background: #2b9348;
    }

    .scanBtn {
      background: #0077b6;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .transactionBox {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .transaction {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .greenText {
      color: green;
      font-weight: bold;
    }

    .redText {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .cards {
        flex-direction: column;
      }

      .buttons {
        flex-direction: column;
      }

      table {
        display: block;
        overflow-x: auto;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <h1>Store Inventory Dashboard</h1>

  <div class="sub">
    QR Based Mobile Inventory Management System
  </div>

  <div class="cards">

    <div class="card">
      <h3>Total Materials</h3>
      <p id="materialCount"></p>
    </div>

    <div class="card">
      <h3>Total Stock</h3>
      <p id="totalStock"></p>
    </div>

    <div class="card">
      <h3>Low Stock</h3>
      <p id="lowStockCount"></p>
    </div>

  </div>

  <input
    type="text"
    class="searchBox"
    placeholder="Search Material"
    onkeyup="searchMaterial(this.value)"
  >

  <table>

    <thead>
      <tr>
        <th>Material Code</th>
        <th>Material</th>
        <th>Unit</th>
        <th>Stock</th>
        <th>Rack</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="inventoryTable"></tbody>

  </table>

  <div class="buttons">

    <button class="issue" onclick="manualIssue()">
      Issue Material
    </button>

    <button class="receive" onclick="manualReceive()">
      Receive Material
    </button>

    <button class="scanBtn" onclick="startScanner()">
      Scan QR Code
    </button>

  </div>

  <div id="reader"></div>

  <h3 id="result"></h3>

  <div class="transactionBox">

    <h2>Recent Transactions</h2>

    <div id="transactions"></div>

  </div>

</div>

<script>

const materials = [
  {
    code: '0838181493',
    name: 'TES',
    unit: 'Nos.',
    stock: 95,
    rack: 'A1'
  },
  {
    code: '0838880104',
    name: 'SC Valve New',
    unit: 'Nos.',
    stock: 100,
    rack: 'A2'
  },
  {
    code: '0838881066',
    name: 'Combo Valve',
    unit: 'Nos.',
    stock: 75,
    rack: 'A3'
  },
  {
    code: '0838882104',
    name: 'LOT Valve',
    unit: 'Nos.',
    stock: 60,
    rack: 'A4'
  },
  {
    code: '0838911014',
    name: 'Pressure Regulator',
    unit: 'Nos.',
    stock: 40,
    rack: 'B1'
  },
  {
    code: '0838920104',
    name: 'Safety Caps',
    unit: 'Nos.',
    stock: 250,
    rack: 'B2'
  },
  {
    code: '0838929014',
    name: 'Nylon Thread',
    unit: 'Nos.',
    stock: 150,
    rack: 'B3'
  },
  {
    code: '0838929034',
    name: 'SS Clip',
    unit: 'Nos.',
    stock: 80,
    rack: 'B4'
  },
  {
    code: '0838930764',
    name: 'NBR O-Ring',
    unit: 'Nos.',
    stock: 120,
    rack: 'C1'
  }
];

const minStock = 20;

function renderTable() {

  const table = document.getElementById('inventoryTable');

  table.innerHTML = '';

  let totalStock = 0;
  let lowStock = 0;

  materials.forEach((item, index) => {

    totalStock += item.stock;

    if (item.stock < minStock) {
      lowStock++;
    }

    table.innerHTML += `

      <tr>
        <td>${item.code}</td>
        <td>${item.name}</td>
        <td>${item.unit}</td>
        <td>${item.stock}</td>
        <td>${item.rack}</td>
        <td class="${item.stock < minStock ? 'low' : 'normal'}">
          ${item.stock < minStock ? 'Low Stock' : 'Normal'}
        </td>
      </tr>

    `;
  });

  document.getElementById('materialCount').innerHTML = materials.length;

  document.getElementById('totalStock').innerHTML = totalStock;

  document.getElementById('lowStockCount').innerHTML = lowStock;
}

function addTransaction(text, cls) {

  const transactions = document.getElementById('transactions');

  const div = document.createElement('div');

  div.className = 'transaction';

  div.innerHTML = `
    <span class="${cls}">${text}</span>
    <br>
    <small>${new Date().toLocaleString()}</small>
  `;

  transactions.prepend(div);
}

function manualIssue() {

  const code = prompt('Enter material code');

  const material = materials.find(m => m.code === code);

  if (!material) {
    alert('Material not found');
    return;
  }

  const qty = parseInt(prompt('Enter issue quantity'));

  if (!qty || qty <= 0) {
    alert('Invalid quantity');
    return;
  }

  if (qty > material.stock) {
    alert('Insufficient stock');
    return;
  }

  material.stock -= qty;

  renderTable();

  addTransaction(
    `Issued ${qty} ${material.name}`,
    'redText'
  );
}

function manualReceive() {

  const code = prompt('Enter material code');

  const material = materials.find(m => m.code === code);

  if (!material) {
    alert('Material not found');
    return;
  }

  const qty = parseInt(prompt('Enter receive quantity'));

  if (!qty || qty <= 0) {
    alert('Invalid quantity');
    return;
  }

  material.stock += qty;

  renderTable();

  addTransaction(
    `Received ${qty} ${material.name}`,
    'greenText'
  );
}

function searchMaterial(value) {

  value = value.toLowerCase();

  const rows = document.querySelectorAll('#inventoryTable tr');

  rows.forEach(row => {

    if (
      row.innerText.toLowerCase().includes(value)
    ) {
      row.style.display = '';
    }
    else {
      row.style.display = 'none';
    }
  });
}

function startScanner() {

  const html5QrCode = new Html5Qrcode('reader');

  html5QrCode.start(

    { facingMode: 'environment' },

    {
      fps: 10,
      qrbox: 250
    },

    (decodedText) => {

      document.getElementById('result').innerHTML =
        'Scanned Material: ' + decodedText;

      const material = materials.find(m =>
        decodedText.includes(m.code)
      );

      if (!material) {
        alert('Unknown Material');
        html5QrCode.stop();
        return;
      }

      const action = prompt(
        'Type ISSUE or RECEIVE'
      );

      if (!action) {
        html5QrCode.stop();
        return;
      }

      const qty = parseInt(
        prompt('Enter quantity')
      );

      if (!qty || qty <= 0) {
        alert('Invalid quantity');
        html5QrCode.stop();
        return;
      }

      if (action.toLowerCase() === 'issue') {

        if (qty > material.stock) {
          alert('Insufficient stock');
        }

        else {

          material.stock -= qty;

          renderTable();

          addTransaction(
            `QR Issued ${qty} ${material.name}`,
            'redText'
          );

          alert('Material issued successfully');
        }
      }

      else if (
        action.toLowerCase() === 'receive'
      ) {

        material.stock += qty;

        renderTable();

        addTransaction(
          `QR Received ${qty} ${material.name}`,
          'greenText'
        );

        alert('Material received successfully');
      }

      else {

        alert('Type ISSUE or RECEIVE only');
      }

      html5QrCode.stop();
    }

  ).catch(err => {

    alert('Camera Error: ' + err);

  });
}

renderTable();

</script>

</body>
</html>
