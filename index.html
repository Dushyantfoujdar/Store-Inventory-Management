let materials = defaultMaterials;

function saveData(){

localStorage.setItem(
'materials',
JSON.stringify(materials)
);

}

function renderTable(){

const table =
document.getElementById('inventoryTable');

table.innerHTML = '';

let low = 0;

materials.forEach(item=>{

if(item.stock <= item.reorder){

low++;

}

table.innerHTML += `

<tr>

<td>${item.code}</td>

<td>${item.name}</td>

<td>${item.stock}</td>

<td>${item.reorder}</td>

<td class="${item.stock<=item.reorder?'low':'normal'}">

${item.stock<=item.reorder?'Low':'Normal'}

</td>

</tr>

`;

});

document.getElementById('lowStock').innerHTML =
low;

document.getElementById('totalMaterials').innerHTML =
materials.length;

fillDropdown();

saveData();

createChart();

}

function fillDropdown(){

const dropdown =
document.getElementById('materialSelect');

dropdown.innerHTML='';

materials.forEach(item=>{

dropdown.innerHTML += `

<option value="${item.code}">
${item.code} - ${item.name}
</option>

`;

});

}

let currentAction='';

function openPanel(action){

currentAction = action;

document.getElementById('transactionPanel').style.display='block';

document.getElementById('panelTitle').innerHTML=
action.toUpperCase() + ' Material';

}

function submitTransaction(){

const code =
document.getElementById('materialSelect').value;

const qty =
parseInt(
document.getElementById('qtyInput').value
);

const material =
materials.find(m=>m.code===code);

if(!material || !qty){

alert('Invalid Data');

return;

}

if(currentAction==='issue'){

if(qty > material.stock){

alert('Insufficient Stock');

return;

}

material.stock -= qty;

addHistory(
'Issued',
material.name,
qty,
material.stock
);

}

if(currentAction==='receive'){

material.stock += qty;

addHistory(
'Received',
material.name,
qty,
material.stock
);

}

renderTable();

document.getElementById('qtyInput').value='';

alert('Transaction Successful');

}

function addHistory(action,name,qty,balance){

const div =
document.createElement('div');

div.className='transaction';

div.innerHTML=`

<b>${action}</b> - ${name}

<br>

Quantity: ${qty}

<br>

Balance Stock: ${balance}

<br>

${new Date().toLocaleString()}

`;

document.getElementById('transactions')
.prepend(div);

}

function searchMaterial(value){

value = value.toLowerCase();

const rows =
document.querySelectorAll('#inventoryTable tr');

rows.forEach(row=>{

if(
row.innerText.toLowerCase().includes(value)
){

row.style.display='';

}

else{

row.style.display='none';

}

});

}

function startScanner(){

const html5QrCode =
new Html5Qrcode('reader');

html5QrCode.start(

{ facingMode:'environment' },

{
fps:10,
qrbox:250
},

(decodedText)=>{

const material =
materials.find(m=>
decodedText.includes(m.code)
);

if(!material){

alert('Unknown Material');

html5QrCode.stop();

return;

}

alert('Scanned: '+material.name);

html5QrCode.stop();

}

);

}

function generateQR(){

const code =
prompt('Enter Material Code');

document.getElementById('qrcode').innerHTML='';

new QRCode(
document.getElementById('qrcode'),
{
text:code,
width:200,
height:200
}
);

}

let chart;

function createChart(){

const ctx =
document.getElementById('stockChart');

if(chart){
chart.destroy();
}

chart = new Chart(ctx,{

type:'bar',

data:{

labels:
materials.map(m=>m.name),

datasets:[{

label:'Current Stock',

data:
materials.map(m=>m.stock),

backgroundColor:'#2563eb'

}]

}

});

}

function downloadPDF(){

const { jsPDF } = window.jspdf;

const doc = new jsPDF();

let y=20;

doc.text(
'Inventory Report',
10,
10
);

materials.forEach(item=>{

doc.text(

item.name+
' - Stock: '+item.stock,

10,
y

);

y += 10;

});

doc.save('InventoryReport.pdf');

}

function exportExcel(){

const worksheet =
XLSX.utils.json_to_sheet(materials);

const workbook =
XLSX.utils.book_new();

XLSX.utils.book_append_sheet(
workbook,
worksheet,
'Inventory'
);

XLSX.writeFile(
workbook,
'Inventory.xlsx'
);

}

function toggleMode(){

document.body.classList.toggle('lightMode');
