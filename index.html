<!DOCTYPE html>
<html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TES Inventory Dashboard</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dff6ff, #ffffff);
    }

    .app {
      padding: 20px;
    }

    h1 {
      color: #003566;
      margin-bottom: 5px;
    }

    .sub {
      color: #555;
      margin-bottom: 20px;
    }

    .cards {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      flex: 1;
      min-width: 150px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card p {
      font-size: 30px;
      color: #3a0ca3;
      font-weight: bold;
      margin: 10px 0 0 0;
    }

    .searchBox {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      margin-top: 20px;
      box-sizing: border-box;
      font-size: 16px;
    }

    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      background: white;
      border-radius: 15px;
      overflow: hidden;
    }

    th {
      background: #caf0f8;
      padding: 15px;
      text-align: left;
    }

    td {
      padding: 15px;
      border-top: 1px solid #eee;
    }

    .normal {
      color: green;
      font-weight: bold;
    }

    .low {
      color: red;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    button {
      padding: 15px 20px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      flex: 1;
    }

    .issue {
      background: #ef233c;
    }

    .receive {
      background: #2b9348;
    }

    .scanBtn {
      background: #0077b6;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    .transactionBox {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .transaction {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .greenText {
      color: green;
      font-weight: bold;
    }

    .redText {
      color: red;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .cards {
        flex-direction: column;
      }

      .buttons {
        flex-direction: column;
      }

      table {
        display: block;
        overflow-x: auto;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <h1>TES Inventory Dashboard</h1>

  <div class="sub">
    QR Based Mobile Inventory Management System
  </div>

  <div class="cards">

    <div class="card">
      <h3>Total Materials</h3>
      <p>1</p>
    </div>

    <div class="card">
      <h3>Total Stock</h3>
      <p id="totalStock">95</p>
    </div>

    <div class="card">
      <h3>Low Stock</h3>
      <p id="lowStockCount">0</p>
    </div>

  </div>

  <input
    type="text"
    class="searchBox"
    placeholder="Search TES"
    onkeyup="searchMaterial(this.value)"
  >

  <table>

    <thead>
      <tr>
        <th>Material Code</th>
        <th>Material</th>
        <th>Stock</th>
        <th>Rack</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="inventoryTable">

      <tr>
        <td>0838181493</td>
        <td>TES</td>
        <td id="tableStock">95</td>
        <td>A1</td>
        <td id="status" class="normal">Normal</td>
      </tr>

    </tbody>

  </table>

  <div class="buttons">

    <button class="issue" onclick="issueMaterial()">
      Issue TES
    </button>

    <button class="receive" onclick="receiveMaterial()">
      Receive TES
    </button>

    <button class="scanBtn" onclick="startScanner()">
      Scan QR Code
    </button>

  </div>

  <div id="reader"></div>

  <h3 id="result"></h3>

  <div class="transactionBox">

    <h2>Recent Transactions</h2>

    <div id="transactions"></div>

  </div>

</div>

<script>

  let stock = 95;

  const minStock = 20;

  function updateUI() {

    document.getElementById('totalStock').innerHTML = stock;

    document.getElementById('tableStock').innerHTML = stock;

    const status = document.getElementById('status');

    if (stock < minStock) {

      status.innerHTML = 'Low Stock';

      status.className = 'low';

      document.getElementById('lowStockCount').innerHTML = 1;
    }

    else {

      status.innerHTML = 'Normal';

      status.className = 'normal';

      document.getElementById('lowStockCount').innerHTML = 0;
    }
  }

  function addTransaction(text, cls) {

    const transactions =
      document.getElementById('transactions');

    const div = document.createElement('div');

    div.className = 'transaction';

    div.innerHTML = `
      <span class="${cls}">${text}</span>
      <br>
      <small>${new Date().toLocaleString()}</small>
    `;

    transactions.prepend(div);
  }

  function issueMaterial() {

    const qty = parseInt(
      prompt('Enter issue quantity')
    );

    if (!qty || qty <= 0) {

      alert('Invalid quantity');

      return;
    }

    if (qty > stock) {

      alert('Insufficient stock');

      return;
    }

    stock = stock - qty;

    updateUI();

    addTransaction(
      `Issued ${qty} TES`,
      'redText'
    );

    alert(qty + ' TES issued successfully');
  }

  function receiveMaterial() {

    const qty = parseInt(
      prompt('Enter receive quantity')
    );

    if (!qty || qty <= 0) {

      alert('Invalid quantity');

      return;
    }

    stock = stock + qty;

    updateUI();

    addTransaction(
      `Received ${qty} TES`,
      'greenText'
    );

    alert(qty + ' TES received successfully');
  }

  function searchMaterial(value) {

    value = value.toLowerCase();

    const table =
      document.getElementById('inventoryTable');

    if (
      value.includes('tes') ||
      value.includes('0838181493') ||
      value === ''
    ) {

      table.style.display = '';
    }

    else {

      table.style.display = 'none';
    }
  }

  function startScanner() {

    const html5QrCode =
      new Html5Qrcode('reader');

    html5QrCode.start(

      { facingMode: 'environment' },

      {
        fps: 10,
        qrbox: 250
      },

      (decodedText) => {

        document.getElementById('result').innerHTML =
          'Scanned Material: ' + decodedText;

        if (
          decodedText.includes('0838181493') ||
          decodedText.toLowerCase().includes('tes')
        ) {

          const action = prompt(
            'Type ISSUE or RECEIVE'
          );

          if (!action) {

            html5QrCode.stop();

            return;
          }

          const qty = parseInt(
            prompt('Enter quantity')
          );

          if (!qty || qty <= 0) {

            alert('Invalid quantity');

            html5QrCode.stop();

            return;
          }

          if (
            action.toLowerCase() === 'issue'
          ) {

            if (qty > stock) {

              alert('Insufficient stock');
            }

            else {

              stock = stock - qty;

              updateUI();

              addTransaction(
                `QR Issued ${qty} TES`,
                'redText'
              );

              alert(
                qty + ' TES issued successfully'
              );
            }
          }

          else if (
            action.toLowerCase() === 'receive'
          ) {

            stock = stock + qty;

            updateUI();

            addTransaction(
              `QR Received ${qty} TES`,
              'greenText'
            );

            alert(
              qty + ' TES received successfully'
            );
          }

          else {

            alert(
              'Type ISSUE or RECEIVE only'
            );
          }
        }

        else {

          alert('Unknown Material');
        }

        html5QrCode.stop();
      }

    ).catch(err => {

      alert('Camera Error: ' + err);

    });
  }

  updateUI();

</script>

</body>
</html>
